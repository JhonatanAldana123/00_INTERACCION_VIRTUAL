<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #222; margin: 0; padding: 24px 16px; }
  main { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  label { display: block; font-size: .9rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
  canvas { display: block; margin: 20px auto; max-width: 100%; }
  .url { font-size: .8rem; word-break: break-all; text-align: center; color: #555; }
  a.url { color: #0969da; }
  button { width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px; background: #0969da; color: #fff; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Generador de QR para el visor AR</h1>
  <label for="modelo">Nombre del modelo (sin extensión)</label>
  <input id="modelo" value="Exh_opc_01">
  <canvas id="qr"></canvas>
  <a id="url" class="url" target="_blank"></a>
  <button id="descargar">Descargar PNG</button>
</main>
<script>
  const BASE = 'https://jhonatanaldana123.github.io/00_INTERACCION_VIRTUAL/';
  const input = document.getElementById('modelo');
  const canvas = document.getElementById('qr');
  const link = document.getElementById('url');

  function dibujar() {
    const modelo = input.value.trim();
    const url = `${BASE}?modelo=${encodeURIComponent(modelo)}`;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();

    // 1024 px aprox. para buena calidad de impresión, con margen de 4 módulos
    const n = qr.getModuleCount();
    const margen = 4;
    const celda = Math.floor(1024 / (n + margen * 2));
    const lado = celda * (n + margen * 2);
    canvas.width = canvas.height = lado;
    canvas.style.width = canvas.style.height = '300px';

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, lado, lado);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect((c + margen) * celda, (r + margen) * celda, celda, celda);

    link.textContent = link.href = url;
  }

  document.getElementById('descargar').onclick = () => {
    const a = document.createElement('a');
    a.download = `QR_${input.value.trim() || 'modelo'}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  input.addEventListener('input', dibujar);
  dibujar();
</script>
</body>
</html>
