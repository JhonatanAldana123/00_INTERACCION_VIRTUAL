<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tarjeta AR · tarjeta con QR de prueba</title>
  <!-- Muestra la tarjeta con el QR puesto en su reserva (1,4 × 1,4 cm), para probar SIN imprimir:
       1) con el celular escanea el QR de esta pantalla  2) toca «Comenzar»  3) apunta a la tarjeta de la pantalla.
       También descarga el QR solo (SVG / PNG) para pegarlo en el arte. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #5f5f5f; color: #fff; display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .tarjeta { position: relative; height: min(86vh, 908px); aspect-ratio: 1000 / 1775; background: #fff; border-radius: 4%; overflow: hidden; flex: none; }
    .tarjeta img { width: 100%; height: 100%; display: block; }
    /* Reserva blanca medida en el arte (1000 × 1775 px): x 346–653, y 0–295 */
    .tarjeta .qr { position: absolute; left: 35.6%; top: 0.4%; width: 28.8%; }
    .tarjeta .qr svg { width: 100%; height: auto; display: block; }
    aside { max-width: 340px; font-size: 14px; line-height: 1.5; }
    aside h1 { font-size: 18px; margin: 0 0 10px; }
    aside ol { padding-left: 20px; }
    label { display: block; margin: 14px 0 4px; font-size: 12px; opacity: .8; }
    input { width: 100%; padding: 8px; font-size: 13px; border-radius: 6px; border: 0; box-sizing: border-box; }
    button { margin: 12px 8px 0 0; padding: 9px 14px; font-size: 13px; border: 0; border-radius: 6px; cursor: pointer; }
    code { font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <img src="tarjeta.png" alt="Tarjeta Innercia">
    <div class="qr" id="qr"></div>
  </div>
  <aside>
    <h1>Probar sin imprimir</h1>
    <ol>
      <li>Publica el sitio (GitHub Desktop → Commit → Push).</li>
      <li>Escanea este QR con la cámara del celular.</li>
      <li>Toca <b>Comenzar</b> y permite la cámara.</li>
      <li>Apunta a la tarjeta de esta pantalla.</li>
    </ol>
    <label for="num">Tarjeta (cada una tiene su QR fijo; la pieza se asigna en tarjetas.json)</label>
    <select id="num" style="width:100%;padding:8px;font-size:13px;border-radius:6px;border:0">
      <option value="1">Tarjeta 1</option><option value="2">Tarjeta 2</option>
      <option value="3">Tarjeta 3</option><option value="4">Tarjeta 4</option>
    </select>
    <label for="url">Dirección que abre el QR</label>
    <input id="url">
    <p><code id="info"></code></p>
    <button id="svg">Descargar QR (SVG, 14 mm)</button>
    <button id="png">Descargar QR (PNG)</button>
  </aside>

  <script>
    const entrada = document.getElementById('url');
    const LADO_MM = 14;
    let svgActual = '';

    function dibujar() {
      const qr = qrcode(0, 'M');          // tamaño mínimo que quepa, corrección media
      qr.addData(entrada.value.trim());
      qr.make();
      const n = qr.getModuleCount(), margen = 2, total = n + margen * 2;
      let d = '';
      for (let f = 0; f < n; f++) for (let c = 0; c < n; c++) if (qr.isDark(f, c)) d += `M${c + margen} ${f + margen}h1v1h-1z`;
      svgActual = `<svg xmlns="http://www.w3.org/2000/svg" width="${LADO_MM}mm" height="${LADO_MM}mm" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
      document.getElementById('qr').innerHTML = svgActual;
      document.getElementById('info').textContent = `${n} × ${n} cuadros · cada cuadro ≈ ${(LADO_MM / total).toFixed(2)} mm impreso`;
    }

    function descargar(nombre, blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
    }
    const num = document.getElementById('num');
    document.getElementById('svg').onclick = () => descargar(`QR_tarjeta_${num.value}_14mm.svg`, new Blob([svgActual], { type: 'image/svg+xml' }));
    document.getElementById('png').onclick = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 1024;
        const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, 1024, 1024);
        c.toBlob(b => descargar(`QR_tarjeta_${num.value}.png`, b));
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(svgActual);
    };

    entrada.oninput = dibujar;
    // Dirección corta y fija por tarjeta (…/t/1): menos cuadros en el QR = se lee mejor a 14 mm
    let base = 'https://innerciaar.com/';
    const elegir = () => { entrada.value = base + 't/' + num.value; dibujar(); };
    num.onchange = elegir;
    fetch('../../sitio.json').then(r => r.json()).catch(() => ({ url: base })).then(s => {
      base = s.url.replace(/\/?$/, '/');
      elegir();
    });

    // Solo en el computador (servidor-tarjeta.js): guarda los 4 QR como archivos en pruebas/tarjeta/
    window.guardarTodos = async () => {
      const hechos = [];
      for (const n of [1, 2, 3, 4]) {
        num.value = n; elegir();
        const r = await fetch(`/__tarjeta/guardar?archivo=QR_tarjeta_${n}_14mm.svg`, { method: 'POST', body: svgActual });
        hechos.push({ ...(await r.json()), url: entrada.value, info: document.getElementById('info').textContent });
      }
      num.value = 1; elegir();
      return hechos;
    };
  </script>
</body>
</html>
