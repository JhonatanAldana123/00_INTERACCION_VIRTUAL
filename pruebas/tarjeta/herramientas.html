<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tarjeta AR · herramientas</title>
  <!-- Solo para el computador (con scripts/servidor-tarjeta.js):
       1) compila tarjeta.png → tarjeta.mind (lo que la cámara aprende a reconocer)
       2) graba un video de relleno (video.mp4) mientras llega el video real -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 640px; color: #222; }
    button { padding: 10px 16px; font-size: 15px; margin: 6px 6px 6px 0; cursor: pointer; }
    pre { background: #f2f2f2; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    canvas { max-width: 320px; border: 1px solid #ccc; display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Tarjeta AR · herramientas</h1>
  <button id="compilar">1. Compilar reconocimiento (tarjeta.png → tarjeta.mind)</button>
  <button id="video">2. Grabar video de relleno (20 s)</button>
  <pre id="log">Listo.</pre>
  <canvas id="lienzo" width="1280" height="720"></canvas>

  <script>
    const log = t => { document.getElementById('log').textContent += '\n' + t; };
    const guardar = async (archivo, datos) => {
      const r = await fetch('/__tarjeta/guardar?archivo=' + encodeURIComponent(archivo), { method: 'POST', body: datos });
      if (!r.ok) throw new Error('No se pudo guardar ' + archivo + ' (¿está abierto con servidor-tarjeta.js?)');
      return r.json();
    };

    window.compilar = async () => {
      const img = new Image();
      img.src = 'tarjeta.png?t=' + Date.now();
      await img.decode();
      const compilador = new window.MINDAR.IMAGE.Compiler();
      await compilador.compileImageTargets([img], p => { document.title = 'Compilando ' + p.toFixed(0) + '%'; });
      const datos = await compilador.exportData();
      const r = await guardar('tarjeta.mind', datos);
      log('tarjeta.mind guardado: ' + r.bytes + ' bytes');
      document.title = 'Tarjeta AR · herramientas';
      return r;
    };

    // Video de relleno: 3 «diapositivas» dibujadas en un lienzo y grabadas a .mp4
    window.grabarVideo = async (segundos = 20) => {
      const c = document.getElementById('lienzo');
      const g = c.getContext('2d');
      const tipo = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
      const ext = tipo.startsWith('video/mp4') ? 'mp4' : 'webm';
      const grabador = new MediaRecorder(c.captureStream(30), { mimeType: tipo, videoBitsPerSecond: 2500000 });
      const trozos = [];
      grabador.ondataavailable = e => trozos.push(e.data);
      const fin = new Promise(ok => { grabador.onstop = ok; });
      const DIAPOS = [
        ['REALIDAD AUMENTADA', 'Presentación de prueba'],
        ['DISEÑO BIEN PENSADO', 'Exhibidores que venden más'],
        ['DEL PLANO AL PUNTO DE VENTA', 'Diseño · producción · logística'],
        ['PRODUCTO PATENTADO', 'Armado rápido, sin herramientas'],
        ['TU EXHIBIDOR EN 3D', 'Ahora míralo en tu espacio'],
      ];
      const ini = performance.now();
      grabador.start();
      await new Promise(ok => {
        const cuadro = () => {
          const t = (performance.now() - ini) / 1000;
          const n = Math.min(DIAPOS.length - 1, Math.floor(t / (segundos / DIAPOS.length)));
          const local = t - n * (segundos / DIAPOS.length);
          g.fillStyle = '#005A7C'; g.fillRect(0, 0, c.width, c.height);
          g.fillStyle = '#93C01F'; g.beginPath(); g.moveTo(0, 0); g.lineTo(140, 90); g.lineTo(0, 180); g.fill();
          g.fillStyle = '#0091B5'; g.beginPath(); g.moveTo(0, 180); g.lineTo(140, 90); g.lineTo(140, 270); g.fill();
          g.globalAlpha = Math.min(1, local * 2);
          g.fillStyle = '#fff'; g.textAlign = 'center';
          g.font = 'bold 84px system-ui, sans-serif'; g.fillText(DIAPOS[n][0], c.width / 2, 330 - (1 - g.globalAlpha) * 30);
          g.fillStyle = '#93C01F'; g.font = '48px system-ui, sans-serif'; g.fillText(DIAPOS[n][1], c.width / 2, 420);
          g.globalAlpha = 1;
          g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(140, 640, 1000, 8);
          g.fillStyle = '#93C01F'; g.fillRect(140, 640, 1000 * Math.min(1, t / segundos), 8);
          g.fillStyle = '#fff'; g.font = '28px system-ui, sans-serif'; g.fillText('VIDEO DE RELLENO · ' + (n + 1) + ' / ' + DIAPOS.length, c.width / 2, 610);
          if (t < segundos) requestAnimationFrame(cuadro); else ok();
        };
        cuadro();
      });
      grabador.stop();
      await fin;
      const r = await guardar('video.' + ext, new Blob(trozos, { type: tipo }));
      log('video.' + ext + ' guardado (' + tipo + '): ' + r.bytes + ' bytes');
      return { ...r, tipo };
    };

    document.getElementById('compilar').onclick = () => compilar().catch(e => log('ERROR: ' + e.message));
    document.getElementById('video').onclick = () => grabarVideo().catch(e => log('ERROR: ' + e.message));
  </script>
</body>
</html>
