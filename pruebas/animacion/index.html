<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090D">
  <meta name="color-scheme" content="dark">
  <title>Prueba animación</title>
  <!-- Página de PRUEBA (no la usa ningún QR): animación de armado de la Bandeja Yogo -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #08090D;
      --fg: #E8EBF4;
      --fg-dim: rgba(232,235,244,0.55);
      --accent: #00E5C8;
      --accent-glow: rgba(0,229,200,0.25);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    model-viewer {
      position: fixed; inset: 0; width: 100%; height: 100%; background: var(--bg);
      --progress-bar-color: var(--accent); --progress-bar-height: 2px;
    }
    model-viewer::part(default-ar-button) { display: none; }
    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
      padding: max(env(safe-area-inset-top, 0px), 16px) 20px 40px;
      background: linear-gradient(to bottom, rgba(8,9,13,0.8), transparent);
    }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); border: 1px solid rgba(0,229,200,0.35); padding: 4px 10px; border-radius: 100px;
    }
    .top h1 { margin-top: 8px; font-size: 16px; font-weight: 600; }
    .top p { margin-top: 4px; font-size: 12px; color: var(--fg-dim); }
    .bottom {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 50px 16px max(env(safe-area-inset-bottom, 0px), 22px);
      background: linear-gradient(to top, rgba(8,9,13,0.9), transparent);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .fila { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      font: inherit; cursor: pointer; border-radius: 100px; -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }
    button:active { transform: scale(0.96); }
    .ar {
      background: var(--accent); color: #08090D; border: none; padding: 14px 26px;
      font-size: 15px; font-weight: 700; box-shadow: 0 0 40px var(--accent-glow);
    }
    .sec {
      background: rgba(8,9,13,0.6); color: var(--fg); border: 1px solid rgba(232,235,244,0.2);
      padding: 10px 18px; font-size: 13px; font-weight: 600;
    }
    .tiempo { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <model-viewer id="viewer" ar ar-modes="scene-viewer quick-look" ar-usdz-max-texture-size="2048"
    camera-controls autoplay shadow-intensity="1" shadow-softness="1"
    environment-image="neutral" tone-mapping="neutral" exposure="0.8" touch-action="none"
    camera-orbit="-30deg 65deg auto" alt="Bandeja Yogo: animación de armado"></model-viewer>

  <div class="top">
    <span class="tag">Prueba · animación</span>
    <h1>Bandeja Yogo · armado</h1>
    <p id="paso">Cargando…</p>
  </div>

  <div class="bottom">
    <div class="fila">
      <button class="ar" id="arBtn" hidden>Ver en AR</button>
    </div>
    <div class="fila">
      <button class="sec" id="webxrBtn" hidden>AR WebXR (Android)</button>
      <button class="sec" id="pausaBtn">Pausa</button>
      <button class="sec" id="repetirBtn">Repetir</button>
    </div>
    <span class="tiempo" id="tiempo"></span>
  </div>

  <script>
    // Cambiar al volver a subir los archivos, para que ningún celular use una copia vieja
    const VERSION = '20261004a';
    const viewer = document.getElementById('viewer');
    const abs = f => new URL(`${f}?v=${VERSION}`, location.href).href;  // Scene Viewer necesita la dirección completa
    viewer.src = abs('bandeja-yogo-anim.glb');
    viewer.iosSrc = abs('bandeja-yogo-anim.usdz');  // iPhone: el .usdz animado de Blender (no el que genera model-viewer)

    const isAndroid = /Android/.test(navigator.userAgent);
    const PASOS = [[0, 'Paso 1 · Troquel'], [1, 'Paso 2 · Laterales'], [2.33, 'Paso 3 · Frente y fondo'],
                   [3.67, 'Paso 4 · Copete'], [5, 'Paso 5 · Producto'], [7.33, 'Lista para exhibir']];
    const paso = document.getElementById('paso');
    const tiempo = document.getElementById('tiempo');
    const pausaBtn = document.getElementById('pausaBtn');

    viewer.addEventListener('load', () => {
      document.getElementById('arBtn').hidden = !viewer.canActivateAR;
      document.getElementById('webxrBtn').hidden = !isAndroid;
      requestAnimationFrame(reloj);
    });

    function reloj() {
      const t = viewer.currentTime;
      paso.textContent = PASOS.filter(([ini]) => t >= ini).pop()[1];
      tiempo.textContent = `${t.toFixed(1)} s / ${viewer.duration.toFixed(1)} s`;
      requestAnimationFrame(reloj);
    }

    document.getElementById('arBtn').onclick = () => {
      viewer.arModes = 'scene-viewer quick-look';
      viewer.activateAR();
    };
    // Android: AR dentro del navegador (aquí después irán los botones paso a paso)
    document.getElementById('webxrBtn').onclick = () => {
      viewer.arModes = 'webxr';
      viewer.currentTime = 0;
      viewer.play();
      viewer.activateAR();
    };
    pausaBtn.onclick = () => {
      if (viewer.paused) { viewer.play(); pausaBtn.textContent = 'Pausa'; }
      else { viewer.pause(); pausaBtn.textContent = 'Seguir'; }
    };
    document.getElementById('repetirBtn').onclick = () => {
      viewer.currentTime = 0;
      viewer.play();
      pausaBtn.textContent = 'Pausa';
    };
  </script>
</body>
</html>
