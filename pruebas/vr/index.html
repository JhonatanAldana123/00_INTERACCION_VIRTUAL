<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#03040A">
  <title>Prueba VR · Exhibidor Sello Rojo</title>
  <!-- Página de PRUEBA para Oculus Go / Quest (WebXR). No la usa ningún QR.
       three.js r147 en versión clásica (sin módulos) para que funcione en navegadores viejos. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03040A; color: #E8EBF4;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    #panel { position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px 24px; z-index: 5;
      background: linear-gradient(to bottom, rgba(3,4,10,0.85), rgba(3,4,10,0)); pointer-events: none; }
    #panel h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #00E5C8; }
    #panel p { margin: 0; font-size: 13px; color: rgba(232,235,244,.7); }
    #boton { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 6;
      padding: 16px 34px; font-size: 18px; font-weight: 700; color: #03040A; background: #00E5C8;
      border: 0; border-radius: 100px; cursor: pointer; display: none; }
    #log { position: fixed; left: 12px; bottom: 12px; right: 12px; z-index: 4; max-height: 32%; overflow: auto;
      font: 11px/1.4 Consolas, monospace; color: rgba(232,235,244,.55); pointer-events: none; white-space: pre-wrap; }
    #log .e { color: #ff7a7a; }
  </style>
</head>
<body>
  <div id="panel"><h1>Exhibidor Sello Rojo · prueba VR</h1><p id="estado">Cargando…</p></div>
  <button id="boton" type="button">Entrar en VR</button>
  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <script>
  (function () {
    'use strict';
    var logEl = document.getElementById('log');
    var estadoEl = document.getElementById('estado');
    var boton = document.getElementById('boton');
    function log(m, err) {
      var d = document.createElement('div');
      if (err) d.className = 'e';
      d.textContent = m;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.onerror = function (msg, src, line) { log('ERROR: ' + msg + ' (' + line + ')', true); };
    if (typeof THREE === 'undefined' || !THREE.GLTFLoader) {
      estadoEl.textContent = 'No se pudo cargar three.js (¿sin internet?).';
      log('Faltan las librerías three.js desde jsdelivr', true);
      return;
    }

    var params = new URLSearchParams(location.search);
    var GIRO = parseFloat(params.get('giro') || '0') * Math.PI / 180;      // gira el exhibidor al inicio
    var ESCALA = parseFloat(params.get('escala') || '1');                   // 1 = tamaño real
    var ALTURA_OJOS = 1.6;
    var ARCHIVO = 'exhibidor.glb';
    var NOMBRE_EX = 'EXHIBIDOR 01';                       // título del panel: dice a cuál exhibidor pertenece
    var PANEL_TAMANO = parseFloat(params.get('panel') || '0.7');   // tamaño del panel de escala (1 = el anterior); ?panel=0.5 lo achica más
    var VERSION = 'v15';                         // sube este número en cada cambio
    // Productos para medir el rendimiento:  ?prod=caja (por defecto, caja roja liviana) · ?prod=real · ?prod=sin
    var PROD = params.get('prod') || 'real';
    var VIDRIO = params.get('vidrio') !== '0';            // ?vidrio=0 quita los vidrios del exhibidor
    document.title = 'Prueba VR ' + VERSION;
    log('Versión ' + VERSION + ' · productos: ' + PROD);

    log('UA: ' + navigator.userAgent);
    log('navigator.xr: ' + (navigator.xr ? 'sí' : 'NO'));

    // ---------- escena ----------
    // Ajustes de rendimiento por la dirección:  ?aa=0 (sin suavizado de bordes)  ?res=0.8 (menos resolución)  ?pbr=1 (materiales completos)
    var AA = params.get('aa') !== '0';
    var RES = parseFloat(params.get('res') || '1.2');        // >1 = más nitidez (se dibuja a mayor resolución y se reduce)
    var FOVEA = parseFloat(params.get('fovea') || '0');      // 0 = sin degradado en los bordes de la vista (más nítido); 1 = máximo ahorro
    var PBR = params.get('pbr') === '1';
    var renderer = new THREE.WebGLRenderer({ antialias: AA, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    if (renderer.xr.setFramebufferScaleFactor) renderer.xr.setFramebufferScaleFactor(RES);
    if (renderer.xr.setFoveation) renderer.xr.setFoveation(FOVEA);
    log('Suavizado: ' + (AA ? 'sí' : 'no') + ' · resolución VR: ' + RES + ' · foveación: ' + FOVEA + ' · materiales: ' + (PBR ? 'completos' : 'livianos'));
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03040a);
    scene.fog = new THREE.Fog(0x03040a, 24, 60);
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
    scene.add(camera);

    // El suelo queda ALTURA_OJOS por debajo de la cabeza (en VR 'local' el origen es la cabeza al iniciar)
    var world = new THREE.Group();
    world.position.y = -ALTURA_OJOS;
    scene.add(world);

    // ---------- estación oscura ----------
    scene.add(new THREE.HemisphereLight(0x8fa3c9, 0x05060a, 0.75));
    var sol = new THREE.DirectionalLight(0xffffff, 0.9);
    sol.position.set(2, 6, 3);
    scene.add(sol);
    var relleno = new THREE.PointLight(0x00e5c8, 0.9, 7);
    relleno.position.set(0, 0.4, -2.2);
    world.add(relleno);

    var RADIO_PISO = 14;                                   // la plataforma crece para recibir más exhibidores
    var piso = new THREE.Mesh(new THREE.CircleGeometry(RADIO_PISO, 72),
      new THREE.MeshStandardMaterial({ color: 0x0b0e18, roughness: 0.55, metalness: 0.5 }));
    piso.rotation.x = -Math.PI / 2;
    world.add(piso);
    [2.6, 4.6, 6.6, 9, 11.5, RADIO_PISO - 0.03].forEach(function (r, i) {
      var anillo = new THREE.Mesh(new THREE.RingGeometry(r, r + (i === 5 ? 0.06 : 0.03), 96),
        new THREE.MeshBasicMaterial({ color: (i === 0 || i === 5) ? 0x00e5c8 : 0x0b6b60 }));
      anillo.rotation.x = -Math.PI / 2; anillo.position.y = 0.005;
      world.add(anillo);
    });
    for (var a = 0; a < 16; a++) {   // líneas radiales, del primer anillo al borde
      var ang = a * Math.PI / 8;
      var linea = new THREE.Mesh(new THREE.PlaneGeometry(0.02, RADIO_PISO - 2.6), new THREE.MeshBasicMaterial({ color: 0x0b3f3a }));
      linea.rotation.x = -Math.PI / 2; linea.rotation.z = -ang;
      var rm = (RADIO_PISO + 2.6) / 2;
      linea.position.set(Math.sin(ang) * rm, 0.004, Math.cos(ang) * rm);
      world.add(linea);
    }
    // arcos de la estación
    for (var k = 0; k < 8; k++) {
      var arco = new THREE.Mesh(new THREE.TorusGeometry(14.5, 0.09, 6, 64, Math.PI),
        new THREE.MeshBasicMaterial({ color: 0x0a5a50 }));
      arco.position.z = 8 - k * 6;
      world.add(arco);
    }
    // estrellas
    var pos = new Float32Array(1400 * 3);
    for (var s = 0; s < 1400; s++) {
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, rr = 45 + Math.random() * 25;
      var q = Math.sqrt(1 - u * u);
      pos[s * 3] = rr * q * Math.cos(th); pos[s * 3 + 1] = Math.abs(rr * u) + 2; pos[s * 3 + 2] = rr * q * Math.sin(th);
    }
    var gEst = new THREE.BufferGeometry();
    gEst.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(gEst, new THREE.PointsMaterial({ color: 0xcfe9ff, size: 0.18, fog: false })));

    // charco de luz bajo el exhibidor
    var cv = document.createElement('canvas'); cv.width = cv.height = 256;
    var cx = cv.getContext('2d');
    var gr = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(0,229,200,0.45)'); gr.addColorStop(1, 'rgba(0,229,200,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
    var charco = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
    charco.rotation.x = -Math.PI / 2; charco.position.set(0, 0.008, -2.2);
    world.add(charco);

    // logo al fondo de la estación (lejos para que se note la profundidad, grande para que se lea)
    var LOGO_ANCHO = 6.0, LOGO_ALTO = LOGO_ANCHO * 150 / 620;
    var cvBrillo = document.createElement('canvas'); cvBrillo.width = cvBrillo.height = 256;
    var cxBrillo = cvBrillo.getContext('2d');
    var grBrillo = cxBrillo.createRadialGradient(128, 128, 0, 128, 128, 128);
    grBrillo.addColorStop(0, 'rgba(0,229,200,0.22)'); grBrillo.addColorStop(1, 'rgba(0,229,200,0)');
    cxBrillo.fillStyle = grBrillo; cxBrillo.fillRect(0, 0, 256, 256);
    var brilloLogo = new THREE.Mesh(new THREE.PlaneGeometry(LOGO_ANCHO * 1.5, LOGO_ALTO * 3.2),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cvBrillo), transparent: true, depthWrite: false, fog: false }));
    brilloLogo.position.set(0, 4.0, -8.55);
    world.add(brilloLogo);
    var texLogo = new THREE.TextureLoader().load('logo.png', function () { log('Logo cargado'); },
      undefined, function () { log('No se pudo cargar logo.png', true); });
    texLogo.encoding = THREE.sRGBEncoding;
    texLogo.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    var logo = new THREE.Mesh(new THREE.PlaneGeometry(LOGO_ANCHO, LOGO_ALTO),
      new THREE.MeshBasicMaterial({ map: texLogo, transparent: true, depthWrite: false, fog: false }));
    logo.position.set(0, 4.0, -8.5);       // por encima de la isla (2,1 m) y detrás de ella
    world.add(logo);

    // letrero en el piso con las instrucciones
    function textoTextura(lineas, w, h) {
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var g = c.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,0)'; g.fillRect(0, 0, w, h);
      g.textAlign = 'center'; g.fillStyle = '#00E5C8';
      g.font = 'bold ' + Math.round(h * 0.26) + 'px sans-serif';
      g.fillText(lineas[0], w / 2, h * 0.38);
      g.fillStyle = 'rgba(232,235,244,0.85)';
      g.font = Math.round(h * 0.135) + 'px sans-serif';
      for (var i = 1; i < lineas.length; i++) g.fillText(lineas[i], w / 2, h * (0.38 + 0.22 * i));
      return new THREE.CanvasTexture(c);
    }
    var letrero = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.6),
      new THREE.MeshBasicMaterial({ map: textoTextura(['EMPAQUES · ' + VERSION, 'Gatillo: sacar el empaque',
          'Suelta lejos: cae · en un hueco: se acomoda'], 1024, 384),
        transparent: true, depthWrite: false }));
    letrero.rotation.x = -Math.PI / 2; letrero.position.set(0, 0.012, -0.9);
    world.add(letrero);

    // ---------- panel de escala (vertical, a la derecha) ----------
    // Vive en el espacio de la persona (no en el mundo), al alcance del rayo.
    var PW = 320, PH = 800;
    var BOTONES = [
      { id: 'esc+', r: { x: 30, y: 130, w: 260, h: 170 } },
      { id: 'esc-', r: { x: 30, y: 450, w: 260, h: 170 } },
      { id: 'real', r: { x: 30, y: 650, w: 260, h: 120 } }
    ];
    var panelCv = document.createElement('canvas'); panelCv.width = PW; panelCv.height = PH;
    var panelCx = panelCv.getContext('2d');
    var panelTex = new THREE.CanvasTexture(panelCv);
    var botonHover = null, botonActivo = null, escalaPintada = -1;
    function rectBoton(b) { return b.r; }
    function rectaRedonda(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
      g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
      g.closePath();
    }
    function pintarPanel() {
      var g = panelCx;
      var s = (exActivo && exActivo.pivote) ? exActivo.pivote.scale.x : 1;
      escalaPintada = Math.round(s * 100);
      var real = Math.abs(s - 1) < 0.005;
      g.clearRect(0, 0, PW, PH);
      rectaRedonda(g, 4, 4, PW - 8, PH - 8, 34);
      g.fillStyle = 'rgba(6,10,18,0.88)'; g.fill();
      g.strokeStyle = 'rgba(0,229,200,0.75)'; g.lineWidth = 4; g.stroke();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#00E5C8'; g.font = 'bold 27px sans-serif';
      g.fillText(exActivo ? exActivo.nombre : NOMBRE_EX, PW / 2, 46);
      g.fillStyle = 'rgba(232,235,244,0.65)'; g.font = 'bold 24px sans-serif';
      g.fillText('ESCALA', PW / 2, 90);
      // lectura de la escala actual
      g.fillStyle = real ? '#00E5C8' : '#E8EBF4'; g.font = 'bold 66px sans-serif';
      g.fillText((s >= 10 ? s.toFixed(1) : s.toFixed(2)) + '×', PW / 2, 375);
      BOTONES.forEach(function (b) {
        var r = b.r;
        var vivo = (b.id === botonActivo), sobre = (b.id === botonHover);
        var resaltado = b.id === 'real' && real;
        rectaRedonda(g, r.x, r.y, r.w, r.h, 28);
        g.fillStyle = vivo ? '#00E5C8' : sobre ? 'rgba(0,229,200,0.38)' : resaltado ? 'rgba(0,229,200,0.18)' : 'rgba(255,255,255,0.08)';
        g.fill();
        g.strokeStyle = 'rgba(0,229,200,0.8)'; g.lineWidth = 3; g.stroke();
        g.strokeStyle = vivo ? '#03040A' : '#E8EBF4'; g.fillStyle = g.strokeStyle;
        var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        if (b.id === 'real') {
          g.font = 'bold 60px sans-serif'; g.fillText('1:1', cx, cy - 12);
          g.font = '24px sans-serif'; g.fillText('tamaño real', cx, cy + 36);
        } else {
          g.lineWidth = 16; g.lineCap = 'round';
          g.beginPath(); g.moveTo(cx - 42, cy); g.lineTo(cx + 42, cy); g.stroke();
          if (b.id === 'esc+') { g.beginPath(); g.moveTo(cx, cy - 42); g.lineTo(cx, cy + 42); g.stroke(); }
        }
      });
      panelTex.needsUpdate = true;
    }
    var panel = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22 * PH / PW),
      new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, depthWrite: false }));
    panel.renderOrder = 10;
    panel.visible = false;               // aparece solo al apuntar al exhibidor y se esconde a los 2,5 s
    scene.add(panel);
    var panelHasta = 0;                  // instante (ms) hasta el que el panel sigue visible
    function mostrarPanel() { panelHasta = performance.now() + 2500; }
    var pBox = new THREE.Box3(), pCentro = new THREE.Vector3(), pTam = new THREE.Vector3();
    var pCab = new THREE.Vector3(), pDir = new THREE.Vector3(), pDer = new THREE.Vector3(), pArriba = new THREE.Vector3(0, 1, 0);
    // El panel se ubica junto al exhibidor (a la derecha, visto desde la persona) y mira hacia ella
    var exActivo = null;                 // exhibidor al que se apuntó por última vez: el panel lo controla
    function elegirExhibidor(ex) {
      if (ex && ex !== exActivo) { exActivo = ex; pintarPanel(); }
    }
    function ubicarPanel() {
      var piv = exActivo && exActivo.pivote;
      if (!piv) return;
      pBox.setFromObject(piv);
      pBox.getCenter(pCentro); pBox.getSize(pTam);
      var cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      cam.getWorldPosition(pCab);
      pDir.set(pCentro.x - pCab.x, 0, pCentro.z - pCab.z);
      if (pDir.lengthSq() < 1e-6) pDir.set(0, 0, -1);
      pDir.normalize();
      pDer.crossVectors(pDir, pArriba).normalize();                       // derecha de quien mira
      var mitad = 0.5 * (Math.abs(pDer.x) * pTam.x + Math.abs(pDer.z) * pTam.z);
      panel.position.copy(pCentro).addScaledVector(pDer, mitad + 0.2);
      panel.position.y = Math.max(-1.0, Math.min(0.1, pCentro.y));
      var dist = panel.position.distanceTo(pCab);
      panel.scale.setScalar(Math.max(0.5, Math.min(2, dist / 1.6)) * PANEL_TAMANO);   // se agranda con la distancia para seguir legible
      panel.lookAt(pCab);
      panel.updateMatrixWorld(true);
    }
    function botonEnUv(uv) {
      var x = uv.x * PW, y = (1 - uv.y) * PH;
      for (var i = 0; i < BOTONES.length; i++) {
        var r = BOTONES[i].r;
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return BOTONES[i].id;
      }
      return null;
    }
    function marcarBotones(hover, activo) {
      if (hover === botonHover && activo === botonActivo) return;
      botonHover = hover; botonActivo = activo; pintarPanel();
    }
    pintarPanel();

    // ---------- navegación: escala del exhibidor, acercarse/alejarse y giro ----------
    var ESC_MIN = 0.4, ESC_MAX = 5;
    var rumbo = new THREE.Vector3();
    function rumboCabeza() {
      var cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      cam.getWorldDirection(rumbo); rumbo.y = 0;
      if (rumbo.lengthSq() < 1e-6) rumbo.set(0, 0, -1);
      return rumbo.normalize();
    }
    function avanzar(metros) {                       // positivo = hacia donde mira; se mueve el mundo al revés
      var d = rumboCabeza();
      world.position.x -= d.x * metros; world.position.z -= d.z * metros;
    }
    function escalar(factor) {
      var p = exActivo && exActivo.pivote;
      if (!p) return;
      var s = Math.max(ESC_MIN, Math.min(ESC_MAX, p.scale.x * factor));
      p.scale.setScalar(s);
      if (Math.round(s * 100) !== escalaPintada) pintarPanel();
    }
    function girar(rad) { if (exActivo && exActivo.pivote) exActivo.pivote.rotation.y += rad; }
    function escalaReal() {                          // 1:1 = tamaño nativo del archivo (se exportó con medidas reales)
      var p = exActivo && exActivo.pivote;
      if (p) { p.scale.setScalar(1); pintarPanel(); }
    }
    function aplicarBoton(id, dt) {                  // se llama cada cuadro mientras el botón está presionado
      if (id === 'esc+') escalar(Math.pow(1.7, dt));
      else if (id === 'esc-') escalar(Math.pow(1.7, -dt));
      else if (id === 'acerca') avanzar(1.2 * dt);
      else if (id === 'aleja') avanzar(-1.2 * dt);
      else if (id === 'giraI') girar(1.4 * dt);
      else if (id === 'giraD') girar(-1.4 * dt);
    }

    // ---------- carga del exhibidor ----------
    var contenedor = new THREE.Group();   // se puede girar con el trackpad
    world.add(contenedor);
    var empaques = [];                    // holders (grupo centrado en cada empaque)
    var mallasEmpaque = [];
    var mallasExhibidor = [];             // partes fijas del exhibidor (sin vidrios): al apuntarlas aparece el panel
    var slots = [];                       // casillas del exhibidor donde se acomodan los empaques
    var GRAV = 9.8;
    window.__vr = { empaques: empaques, slots: slots, camera: camera, THREE: THREE };   // para revisar el estado desde la consola
    var tmpBox = new THREE.Box3();

    var draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/draco/gltf/');
    var loader = new THREE.GLTFLoader();
    loader.setDRACOLoader(draco);
    // ---- optimización en la carga: en el Go lo que más pesa son las llamadas de dibujo, no los triángulos ----
    var anisotropia = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    function liviano(m) {                       // PBR -> Lambert (mucho más barato en el Go)
      if (PBR || !m.isMeshStandardMaterial) return m.clone();
      var vidrio = m.transmission > 0;                      // acrílico/vidrio con transmisión: se aproxima con transparencia simple
      var n = new THREE.MeshLambertMaterial({
        name: m.name, color: m.color.clone(), map: m.map, emissive: m.emissive.clone(), emissiveMap: m.emissiveMap,
        emissiveIntensity: m.emissiveIntensity, transparent: m.transparent, opacity: m.opacity,
        side: m.side, alphaTest: m.alphaTest, depthWrite: m.depthWrite
      });
      if (vidrio) { n.transparent = true; n.opacity = 0.28; n.depthWrite = false; }
      return n;
    }
    function afinar(m) { if (m.map) m.map.anisotropy = anisotropia; return m; }
    // junta varias mallas (en el espacio local de 'raiz') en una sola; null si no se puede
    function fusionar(partes, raiz) {
      var inv = new THREE.Matrix4().copy(raiz.matrixWorld).invert();
      var geos = [];
      for (var i = 0; i < partes.length; i++) {
        var p = partes[i];
        var g = p.geometry.clone();
        ['color', 'uv2', 'tangent'].forEach(function (a) { if (g.attributes[a]) g.deleteAttribute(a); });
        var rel = new THREE.Matrix4().multiplyMatrices(inv, p.matrixWorld);
        g.applyMatrix4(rel);
        if (rel.determinant() < 0 && g.index) {          // espejo: se invierte el orden de los triángulos
          var ix = g.index.array;
          for (var t = 0; t < ix.length; t += 3) { var tmp = ix[t]; ix[t] = ix[t + 2]; ix[t + 2] = tmp; }
        }
        geos.push(g);
      }
      // si unas piezas traen uv/normal y otras no, a las que faltan se les pone en cero para poder unirlas
      ['uv', 'normal'].forEach(function (nombre) {
        var algunas = geos.some(function (g) { return g.attributes[nombre]; });
        var todas = geos.every(function (g) { return g.attributes[nombre]; });
        if (algunas && !todas) {
          var tam = nombre === 'uv' ? 2 : 3;
          geos.forEach(function (g) {
            if (!g.attributes[nombre]) g.setAttribute(nombre, new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * tam), tam));
          });
        }
      });
      var unida = THREE.BufferGeometryUtils.mergeBufferGeometries(geos, false);
      if (!unida) log('No se pudieron unir ' + partes.length + ' piezas (' + ((partes[0].material && partes[0].material.name) || 'sin nombre') + '): ' +
        geos.map(function (g) { return Object.keys(g.attributes).join('+') + (g.index ? '/i' : ''); }).slice(0, 3).join(' · '), true);
      return unida;
    }

    var exhibidores = [];
    // cfg: { archivo, nombre, principal, paquetes, pos:[x,z], giro }
    function cargarExhibidor(cfg) {
    var ex = { nombre: cfg.nombre, pivote: null };
    loader.load(cfg.archivo, function (gltf) {
      var modelo = gltf.scene;
      modelo.scale.setScalar(cfg.principal ? ESCALA : 1);
      modelo.updateMatrixWorld(true);

      // 1) nodos de empaque = padres de las partes con material "SELLO ROJO" (solo si el exhibidor tiene empaques sueltos)
      var nodosEmpaque = [];
      modelo.traverse(function (o) {
        if (!o.isMesh || cfg.paquetes === false) return;
        var nm = (o.material && o.material.name) || '';
        var p = o.parent;
        if (nm.indexOf('SELLO ROJO') >= 0 && p && p !== modelo && nodosEmpaque.indexOf(p) < 0) nodosEmpaque.push(p);
      });
      var llamadasAntes = 0;
      modelo.traverse(function (o) { if (o.isMesh) llamadasAntes++; });

      // 2) cada empaque (≈51 partes) pasa a UNA sola malla
      nodosEmpaque.forEach(function (nodo) {
        var partes = [];
        nodo.traverse(function (o) { if (o.isMesh) partes.push(o); });
        nodo.updateWorldMatrix(true, true);
        var geo = partes.length > 1 ? fusionar(partes, nodo) : null;
        if (!geo) return;
        var mat = afinar(liviano(partes[0].material));
        partes.forEach(function (p) { p.parent.remove(p); });
        nodo.add(new THREE.Mesh(geo, mat));
      });

      // 3) el resto del exhibidor (estático) se junta por material
      var grupos = {};
      var ordenGrupos = [];
      modelo.traverse(function (o) {
        if (!o.isMesh) return;
        for (var a = o.parent; a; a = a.parent) if (nodosEmpaque.indexOf(a) >= 0) return;   // ya son parte de un empaque
        var id = o.material.uuid;
        if (!grupos[id]) { grupos[id] = []; ordenGrupos.push(id); }
        grupos[id].push(o);
      });
      ordenGrupos.forEach(function (id) {
        var partes = grupos[id];
        var mat = afinar(liviano(partes[0].material));
        var geo = partes.length > 1 ? fusionar(partes, modelo) : null;
        if (!geo) { partes.forEach(function (p) { p.material = mat; }); return; }
        var m = new THREE.Mesh(geo, mat);
        partes.forEach(function (p) { p.parent.remove(p); });
        modelo.add(m);
      });
      if (!VIDRIO) modelo.traverse(function (o) { if (o.isMesh && /GLASS/.test(o.material.name || '')) o.visible = false; });
      var llamadasDespues = 0;
      modelo.traverse(function (o) { if (o.isMesh) llamadasDespues++; });
      log(cfg.nombre + ' · mallas (llamadas de dibujo): ' + llamadasAntes + ' → ' + llamadasDespues);
      modelo.traverse(function (o) {
        if (!o.isMesh || /GLASS/.test((o.material && o.material.name) || '')) return;
        for (var a = o.parent; a; a = a.parent) if (nodosEmpaque.indexOf(a) >= 0) return;
        o.userData.ex = ex;
        mallasExhibidor.push(o);
      });
      modelo.updateMatrixWorld(true);
      var caja = new THREE.Box3().setFromObject(modelo);
      var size = caja.getSize(new THREE.Vector3());
      var centro = caja.getCenter(new THREE.Vector3());
      modelo.position.set(-centro.x, -caja.min.y, -centro.z);
      var pivote = new THREE.Group();
      if (cfg.podio) modelo.position.y += cfg.podio.alto;     // la pieza se apoya sobre el podio (cubo)
      pivote.add(modelo);
      if (cfg.podio) {
        var pw = cfg.podio.ancho, ph = cfg.podio.alto;
        var podio = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pw), new THREE.MeshLambertMaterial({ color: 0x151b28 }));
        podio.position.y = ph / 2;
        podio.add(new THREE.LineSegments(new THREE.EdgesGeometry(podio.geometry), new THREE.LineBasicMaterial({ color: 0x00e5c8 })));
        var tapa = new THREE.Mesh(new THREE.PlaneGeometry(pw * 0.94, pw * 0.94), new THREE.MeshLambertMaterial({ color: 0x232d48 }));
        tapa.rotation.x = -Math.PI / 2; tapa.position.y = ph / 2 + 0.002;
        podio.add(tapa);
        podio.userData.ex = ex;
        pivote.add(podio);
        mallasExhibidor.push(podio);
      }
      pivote.rotation.y = cfg.giro != null ? cfg.giro : GIRO;
      if (cfg.pos) pivote.position.set(cfg.pos[0], 0, cfg.pos[1]);
      else pivote.position.set(0, 0, -(Math.max(size.x, size.z) / 2 + 1.3));
      contenedor.add(pivote);
      ex.pivote = pivote;
      exhibidores.push(ex);
      if (!exActivo || cfg.principal) elegirExhibidor(ex);
      pivote.updateMatrixWorld(true);
      log(cfg.nombre + ': ' + size.x.toFixed(2) + ' × ' + size.y.toFixed(2) + ' × ' + size.z.toFixed(2) + ' m');
      if (cfg.principal) {
        relleno.position.copy(pivote.position).setY(0.5);
        charco.position.x = pivote.position.x; charco.position.z = pivote.position.z;
      } else {                                               // charco de luz propio
        var charco2 = charco.clone();
        charco2.position.set(pivote.position.x, 0.008, pivote.position.z);
        charco2.scale.setScalar(Math.max(size.x, size.z) / 2.2);
        world.add(charco2);
      }

      // Cada empaque del glb es un nodo con ~51 partes (todas con el material "SELLO ROJO")
      var triangulos = 0;
      modelo.traverse(function (o) {
        if (!o.isMesh) return;
        var g = o.geometry;
        triangulos += (g.index ? g.index.count : g.attributes.position.count) / 3;
      });
      log('Triángulos totales: ' + Math.round(triangulos));

      // Cada empaque se envuelve en un grupo centrado en su caja, para poder agarrarlo por el centro
      nodosEmpaque.forEach(function (nodo) {
        nodo.updateWorldMatrix(true, true);
        tmpBox.setFromObject(nodo);
        var centroMundo = tmpBox.getCenter(new THREE.Vector3());
        var padre = nodo.parent;
        var holder = new THREE.Group();
        padre.add(holder);
        padre.updateWorldMatrix(true, false);
        holder.position.copy(padre.worldToLocal(centroMundo.clone()));
        holder.updateMatrixWorld(true);
        holder.attach(nodo);
        var partes = [];
        if (PROD === 'caja') {                   // caja roja del mismo tamaño: 12 triángulos y sin textura
          nodo.traverse(function (m) {
            if (!m.isMesh) return;
            m.geometry.computeBoundingBox();
            var bb = m.geometry.boundingBox, sz = bb.getSize(new THREE.Vector3()), ce = bb.getCenter(new THREE.Vector3());
            var cg = new THREE.BoxGeometry(sz.x, sz.y, sz.z);
            cg.translate(ce.x, ce.y, ce.z);
            m.geometry = cg;
            m.material = new THREE.MeshLambertMaterial({ color: 0xc0121a });
          });
        }
        nodo.traverse(function (m) {
          if (m.isMesh) { partes.push(m); mallasEmpaque.push(m); }
        });
        if (PROD === 'sin') { nodo.visible = false; partes.forEach(function () { mallasEmpaque.pop(); }); partes = []; }
        // medidas del empaque (para apoyarlo plano en el piso) y su lugar en el exhibidor (casilla)
        var dims = new THREE.Vector3(0.1, 0.1, 0.1);
        if (partes.length) { partes[0].geometry.computeBoundingBox(); partes[0].geometry.boundingBox.getSize(dims); }
        var ejeFino = dims.x <= dims.y && dims.x <= dims.z ? 0 : (dims.y <= dims.z ? 1 : 2);
        holder.userData = {
          esHolder: true, ex: ex, partes: partes, estado: 'reposo', padre: padre,
          pos0: holder.position.clone(), quat0: holder.quaternion.clone(), esc0: holder.scale.clone(),
          dims: dims, ejeFino: ejeFino, espesor: dims.getComponent(ejeFino),
          vel: new THREE.Vector3(), v: new THREE.Vector3(), omega: new THREE.Vector3(), pPrev: null,
          contacto: false, qFlat: null, slot: null
        };
        var casilla = { pos: holder.position.clone(), quat: holder.quaternion.clone(), scale: holder.scale.clone(), padre: padre, ocupado: holder };
        holder.userData.slot = casilla; holder.userData.slotOrigen = casilla;
        slots.push(casilla);
        empaques.push(holder);
      });
      if (cfg.paquetes !== false) log('Empaques sueltos: ' + empaques.length + (empaques.length ? '' : ' (no se encontraron)'), empaques.length === 0);
      estadoEl.textContent = exhibidores.length + ' exhibidores cargados · ' +
        (renderer.xr.isPresenting ? 'apunta con el mando' : 'arrastra para mirar, clic en un empaque');
    }, function (xhr) {
      if (xhr.total) estadoEl.textContent = 'Cargando ' + cfg.nombre + ' ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
    }, function (e) { log('No se pudo cargar ' + cfg.archivo + ': ' + (e && e.message ? e.message : e), true); });
    }

    // Distribución en cruz vista desde arriba, con la persona en el centro (0, 0):
    //   adelante (lado del logo): ISLA 2X2 · atrás: EXHIBIDOR 01 · izquierda y derecha: pendientes
    // Los frentes de los exhibidores miran al centro. Los brazos quedan a ~2,4 m del centro (borde frontal).
    cargarExhibidor({ archivo: 'isla.glb', nombre: 'ISLA 2X2', principal: false, paquetes: false, pos: [0, -3.5], giro: 0 });
    cargarExhibidor({ archivo: ARCHIVO, nombre: 'EXHIBIDOR 01', principal: true, paquetes: true, pos: [0, 2.6], giro: Math.PI });
    // Derecha: la bandeja Yogo exhibida sobre un podio (cubo) tipo mesa, mirando al centro
    cargarExhibidor({ archivo: 'bandeja.glb', nombre: 'BANDEJA YOGO', principal: false, paquetes: false, pos: [2.7, 0],
      giro: -Math.PI / 2, podio: { ancho: 0.55, alto: 0.8 } });

    // ---------- interacción ----------
    var raycaster = new THREE.Raycaster();
    raycaster.far = 14;
    var tmpMat = new THREE.Matrix4();
    var controles = [];
    function holderDe(malla) {
      var o = malla;
      while (o && !(o.userData && o.userData.esHolder)) o = o.parent;
      return o;
    }

    function resaltar(holder, si) {
      holder.userData.partes.forEach(function (p) {
        var m = p.material;
        if ('emissive' in m) { m.emissive.setHex(si ? 0x00e5c8 : 0x000000); m.emissiveIntensity = si ? 0.35 : 0; }
      });
    }
    var vA = new THREE.Vector3(), vB = new THREE.Vector3(), qA = new THREE.Quaternion(), qB = new THREE.Quaternion();
    var ARRIBA = new THREE.Vector3(0, 1, 0);

    function agarrar(holder, padreNuevo, posLocal) {
      var u = holder.userData;
      padreNuevo.attach(holder);
      if (u.slot) { u.slot.ocupado = null; u.slot = null; }          // la casilla queda libre
      u.estado = 'agarrado'; u.destino = posLocal; u.escDestino = 1.8; u.agarradoPor = padreNuevo;
      u.pPrev = null; u.vel.set(0, 0, 0);
    }

    // casilla libre más cercana al empaque (dentro del radio de acople), o null
    function casillaCercana(holder) {
      var piv = holder.userData.ex && holder.userData.ex.pivote;
      var R = 0.22 * (piv ? piv.scale.x : 1);
      var mejor = null, d2 = R * R;
      holder.getWorldPosition(vA);
      slots.forEach(function (s) {
        if (s.ocupado) return;
        vB.copy(s.pos); s.padre.localToWorld(vB);
        var dd = vB.distanceToSquared(vA);
        if (dd < d2) { d2 = dd; mejor = s; }
      });
      return mejor;
    }
    function acomodar(holder, casilla) {              // el empaque vuela a la casilla y queda ahí
      var u = holder.userData;
      casilla.ocupado = holder; u.slot = casilla; u.padre = casilla.padre;
      u.pos0.copy(casilla.pos); u.quat0.copy(casilla.quat); u.esc0.copy(casilla.scale);
      casilla.padre.attach(holder);
      u.estado = 'regreso';
    }
    function soltar(holder) {
      var u = holder.userData;
      u.agarradoPor = null;
      resaltar(holder, false);
      var casilla = casillaCercana(holder);
      if (casilla) { acomodar(holder, casilla); return; }
      // lejos del exhibidor: cae al piso con el impulso que traía la mano
      world.attach(holder);
      u.estado = 'cayendo'; u.contacto = false; u.qFlat = null;
      u.v.copy(u.vel).multiplyScalar(0.8);
      if (u.v.length() > 3.5) u.v.setLength(3.5);
      u.omega.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(6);
    }
    function devolverACasilla(holder) {               // si se pierde fuera del piso, vuelve al exhibidor
      var u = holder.userData;
      var c = (u.slotOrigen && !u.slotOrigen.ocupado) ? u.slotOrigen : null;
      if (!c) slots.some(function (s) { if (!s.ocupado) { c = s; return true; } return false; });
      if (c) acomodar(holder, c);
    }

    // casilla donde se acomodaría el empaque que tiene en la mano (vista previa tenue)
    var fantasma = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ color: 0x00e5c8, transparent: true, opacity: 0.3, depthWrite: false }));
    fantasma.matrixAutoUpdate = false; fantasma.visible = false;
    scene.add(fantasma);
    var mFant = new THREE.Matrix4(), mEsc = new THREE.Matrix4();
    function actualizarFantasma() {
      var casilla = null, dims = null;
      for (var i = 0; i < empaques.length && !casilla; i++) {
        var h = empaques[i];
        if (h.userData.estado === 'agarrado') { casilla = casillaCercana(h); dims = h.userData.dims; }
      }
      if (!casilla) { fantasma.visible = false; return; }
      mFant.compose(casilla.pos, casilla.quat, casilla.scale);
      mFant.premultiply(casilla.padre.matrixWorld);
      mFant.multiply(mEsc.makeScale(dims.x * 1.04, dims.y * 1.04, dims.z * 1.04));
      fantasma.matrix.copy(mFant); fantasma.matrixWorldNeedsUpdate = true;
      fantasma.visible = true;
    }

    function crearControl(i) {
      var c = renderer.xr.getController(i);
      var rayo = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
        new THREE.LineBasicMaterial({ color: 0x00e5c8 }));
      rayo.scale.z = 3;
      c.add(rayo);
      var cuerpo = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.12), new THREE.MeshStandardMaterial({ color: 0x20242e }));
      cuerpo.position.z = 0.05;
      c.add(cuerpo);
      var punto = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      punto.visible = false;
      scene.add(punto);
      var estado = { obj: c, rayo: rayo, punto: punto, hover: null, agarrado: null, hoverBoton: null, boton: null };
      c.addEventListener('selectstart', function () {
        if (estado.agarrado || estado.boton) return;
        if (estado.hoverBoton) {                       // gatillo sobre un botón del panel
          estado.boton = estado.hoverBoton;
          if (estado.boton === 'real') escalaReal();
          return;
        }
        if (estado.hover && estado.hover.userData.estado !== 'agarrado') {
          estado.agarrado = estado.hover;
          agarrar(estado.agarrado, c, new THREE.Vector3(0, 0, -0.55));
        }
      });
      c.addEventListener('selectend', function () {
        estado.boton = null;
        if (estado.agarrado) { soltar(estado.agarrado); estado.agarrado = null; }
      });
      scene.add(c);
      controles.push(estado);
    }
    crearControl(0); crearControl(1);

    function actualizarApuntado() {
      controles.forEach(function (e) {
        var c = e.obj;
        if (!c.visible) { e.punto.visible = false; return; }
        var previo = e.hover;
        e.hover = null;
        e.hoverBoton = null;
        var largo = 3;
        if (!e.agarrado) {
          tmpMat.identity().extractRotation(c.matrixWorld);
          raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
          raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
          var blancos = mallasEmpaque.concat(mallasExhibidor);
          if (panel.visible) blancos.push(panel);
          var hits = raycaster.intersectObjects(blancos, false);
          if (hits.length) {
            mostrarPanel();                                // apuntar al exhibidor, a un empaque o al panel lo mantiene visible
            if (hits[0].object === panel) {
              e.hoverBoton = botonEnUv(hits[0].uv);
              largo = hits[0].distance;
              e.punto.position.copy(hits[0].point); e.punto.visible = true;
            } else if (mallasExhibidor.indexOf(hits[0].object) >= 0) {
              elegirExhibidor(hits[0].object.userData.ex);
              largo = hits[0].distance;
              e.punto.position.copy(hits[0].point); e.punto.visible = true;
            } else {
              var h = holderDe(hits[0].object);
              if (h.userData.estado !== 'agarrado') {
                elegirExhibidor(h.userData.ex);
                e.hover = h; largo = hits[0].distance;
                e.punto.position.copy(hits[0].point); e.punto.visible = true;
              }
            }
          }
        }
        if (!e.hover && !e.hoverBoton && largo === 3) e.punto.visible = false;
        if (previo !== e.hover) { if (previo) resaltar(previo, false); if (e.hover) resaltar(e.hover, true); }
        e.rayo.scale.z = e.agarrado ? 0.5 : largo;
      });
      var hb = null, ab = null;
      controles.forEach(function (e) { if (e.hoverBoton && !hb) hb = e.hoverBoton; if (e.boton && !ab) ab = e.boton; });
      if (ab) mostrarPanel();
      marcarBotones(hb, ab);
    }

    // animación de empaques (agarrado → hacia la mano · regreso → a su lugar)
    function animarEmpaques(dt) {
      var k = 1 - Math.exp(-12 * dt);
      var qId = new THREE.Quaternion();
      empaques.forEach(function (h) {
        var u = h.userData;
        var piv = u.ex && u.ex.pivote;
        var escEx = piv ? piv.scale.x : 1;                     // los empaques sueltos acompañan la escala de su exhibidor
        if (u.estado === 'agarrado') {
          h.position.lerp(u.destino, k);
          h.quaternion.slerp(qId, k);
          var s = h.scale.x + (u.escDestino * u.esc0.x - h.scale.x) * k;
          h.scale.setScalar(s);
          // velocidad de la mano (para lanzar el empaque al soltarlo)
          h.getWorldPosition(vA);
          if (u.pPrev) { vB.copy(vA).sub(u.pPrev).divideScalar(Math.max(dt, 1e-3)); u.vel.lerp(vB, 0.35); }
          else u.pPrev = new THREE.Vector3();
          u.pPrev.copy(vA);
        } else if (u.estado === 'cayendo' || u.estado === 'suelo') {
          var se = h.scale.x + (escEx - h.scale.x) * k;
          h.scale.setScalar(se);
          var mitad = u.espesor * 0.5 * se;
          if (u.estado === 'cayendo') {
            u.v.y -= GRAV * dt;
            h.position.addScaledVector(u.v, dt);
            if (!u.contacto) {
              var w = u.omega.length();
              if (w > 1e-4) { qA.setFromAxisAngle(vA.copy(u.omega).divideScalar(w), w * dt); h.quaternion.premultiply(qA); }
            }
            if (h.position.y <= mitad) {
              h.position.y = mitad;
              if (!u.contacto) {                                 // primer golpe: se calcula cómo queda apoyado (cara ancha abajo)
                u.contacto = true;
                vA.set(0, 0, 0).setComponent(u.ejeFino, 1).applyQuaternion(h.quaternion);
                qA.setFromUnitVectors(vA, vB.set(0, vA.y >= 0 ? 1 : -1, 0));
                u.qFlat = qA.clone().multiply(h.quaternion);
              }
              u.v.y = Math.abs(u.v.y) > 0.6 ? -u.v.y * 0.25 : 0;
              var fr = Math.exp(-5 * dt);
              u.v.x *= fr; u.v.z *= fr;
            }
            if (u.contacto) {
              h.quaternion.slerp(u.qFlat, 1 - Math.exp(-9 * dt));
              if (u.v.y === 0 && Math.abs(u.v.x) + Math.abs(u.v.z) < 0.03 && h.quaternion.angleTo(u.qFlat) < 0.02) {
                h.quaternion.copy(u.qFlat); u.v.set(0, 0, 0); u.estado = 'suelo';
              }
            }
            if (h.position.y < -4) devolverACasilla(h);          // se salió del piso: vuelve al exhibidor
          } else {
            h.position.y = mitad;
          }
        } else if (u.estado === 'regreso') {
          h.position.lerp(u.pos0, k);
          h.quaternion.slerp(u.quat0, k);
          h.scale.lerp(u.esc0, k);
          if (h.position.distanceTo(u.pos0) < 0.002 && Math.abs(h.scale.x - u.esc0.x) < 0.002) {
            h.position.copy(u.pos0); h.quaternion.copy(u.quat0); h.scale.copy(u.esc0);
            u.estado = 'reposo';
          }
        }
      });
    }

    // trackpad: ◄ ► gira el exhibidor · ▲ ▼ avanza o retrocede hacia donde mira (si ninguna mano sostiene un empaque)
    function leerTrackpad(dt) {
      var ses = renderer.xr.getSession && renderer.xr.getSession();
      if (!ses || !exActivo || !exActivo.pivote) return;
      var alguno = controles.some(function (e) { return e.agarrado; });
      if (alguno) return;
      for (var i = 0; i < ses.inputSources.length; i++) {
        var gp = ses.inputSources[i].gamepad;
        if (gp && gp.axes && gp.axes.length >= 2) {
          var x = gp.axes[0], y = gp.axes[1];
          var mayor = Math.max(Math.abs(x), Math.abs(y));
          if (mayor < 0.12) { ejeBloqueado[i] = null; continue; }          // dedo levantado: se libera el eje
          // Al apoyar el dedo se elige UN eje (el dominante) y se mantiene hasta soltar: evita que avanzar también gire
          if (!ejeBloqueado[i]) {
            if (mayor < 0.45) continue;
            ejeBloqueado[i] = Math.abs(y) > Math.abs(x) ? 'y' : 'x';
          }
          var v = ejeBloqueado[i] === 'y' ? y : x;
          var fuerza = Math.max(0, (Math.abs(v) - 0.3) / 0.7);               // zona muerta del 30 % y arranque suave
          if (fuerza === 0) continue;
          var signo = v < 0 ? -1 : 1;
          if (ejeBloqueado[i] === 'y') avanzar(-signo * fuerza * dt * 1.2);
          else girar(-signo * fuerza * dt * 1.4);
        }
      }
    }
    var ejeBloqueado = [];

    // ---------- modo pantalla (PC / celular): arrastrar para mirar, clic para sacar un empaque ----------
    var yaw = 0, pitch = 0, arrastrando = false, movido = false, px = 0, py = 0;
    var sostenido = null;
    var dom = renderer.domElement;
    var botonPantalla = null;                        // botón del panel presionado con el ratón o el dedo
    var teclas = {};
    dom.addEventListener('pointerdown', function (e) {
      if (!renderer.xr.isPresenting) {
        var r0 = dom.getBoundingClientRect();
        raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r0.left) / r0.width) * 2 - 1, -((e.clientY - r0.top) / r0.height) * 2 + 1), camera);
        var hp = panel.visible ? raycaster.intersectObject(panel, false) : [];
        if (hp.length) {
          var idp = botonEnUv(hp[0].uv);
          if (idp) { botonPantalla = idp; if (idp === 'real') escalaReal(); marcarBotones(null, idp); return; }
        }
      }
      arrastrando = true; movido = false; px = e.clientX; py = e.clientY;
    });
    dom.addEventListener('wheel', function (e) { escalar(e.deltaY < 0 ? 1.1 : 1 / 1.1); e.preventDefault(); }, { passive: false });
    window.addEventListener('keyup', function (e) { teclas[e.key] = false; });
    window.addEventListener('pointerup', function (e) {
      if (botonPantalla) { botonPantalla = null; marcarBotones(null, null); return; }
      if (!arrastrando) return;
      arrastrando = false;
      if (movido || renderer.xr.isPresenting) return;
      if (sostenido) { soltar(sostenido); sostenido = null; return; }
      var r = dom.getBoundingClientRect();
      var ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObjects(mallasEmpaque, false);
      if (hits.length) { sostenido = holderDe(hits[0].object); agarrar(sostenido, camera, new THREE.Vector3(0, 0, -0.7)); }
    });
    window.addEventListener('pointermove', function (e) {
      if (!arrastrando) {                                   // en pantalla: el puntero sobre el exhibidor o el panel muestra el panel
        if (renderer.xr.isPresenting) return;
        var rm = dom.getBoundingClientRect();
        raycaster.setFromCamera(new THREE.Vector2(((e.clientX - rm.left) / rm.width) * 2 - 1, -((e.clientY - rm.top) / rm.height) * 2 + 1), camera);
        var lista = mallasEmpaque.concat(mallasExhibidor);
        if (panel.visible) lista.push(panel);
        var hm = raycaster.intersectObjects(lista, false);
        if (hm.length) {
          mostrarPanel();
          var ob = hm[0].object;
          if (ob !== panel) elegirExhibidor(ob.userData.ex || (holderDe(ob) && holderDe(ob).userData.ex));
        }
        return;
      }
      var dx = e.clientX - px, dy = e.clientY - py;
      if (Math.abs(dx) + Math.abs(dy) > 3) movido = true;
      px = e.clientX; py = e.clientY;
      yaw -= dx * 0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.005));
    });
    window.addEventListener('keydown', function (e) {
      teclas[e.key] = true;
      if (e.key === 'Escape' && sostenido) { soltar(sostenido); sostenido = null; }
    });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- botón Entrar en VR ----------
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
        log('immersive-vr soportado: ' + (ok ? 'sí' : 'NO'), !ok);
        if (!ok) return;
        boton.style.display = 'block';
        boton.addEventListener('click', function () {
          navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] }).then(function (ses) {
            renderer.xr.setSession(ses);
          }).catch(function (e) { log('No se pudo iniciar VR: ' + e.message, true); });
        });
      }).catch(function (e) { log('isSessionSupported falló: ' + e.message, true); });
    } else {
      log('Este navegador no tiene WebXR: solo se verá en modo pantalla.', true);
    }
    renderer.xr.addEventListener('sessionstart', function () {
      document.getElementById('panel').style.display = 'none'; boton.style.display = 'none'; logEl.style.display = 'none';
      if (sostenido) { soltar(sostenido); sostenido = null; }
      if (renderer.xr.setFoveation) renderer.xr.setFoveation(FOVEA);
    });
    renderer.xr.addEventListener('sessionend', function () {
      document.getElementById('panel').style.display = ''; boton.style.display = 'block'; logEl.style.display = '';
    });

    // ---------- bucle ----------
    var reloj = new THREE.Clock();
    renderer.setAnimationLoop(function () {
      var dt = Math.min(reloj.getDelta(), 0.1);
      if (!renderer.xr.isPresenting) {
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
        camera.position.set(0, 0, 0);
      } else {
        actualizarApuntado();
        leerTrackpad(dt);
        controles.forEach(function (e) { if (e.boton) aplicarBoton(e.boton, dt); });
      }
      if (!renderer.xr.isPresenting) {
        if (botonPantalla) aplicarBoton(botonPantalla, dt);
        if (teclas.w || teclas.ArrowUp) avanzar(1.2 * dt);
        if (teclas.s || teclas.ArrowDown) avanzar(-1.2 * dt);
        if (teclas.a || teclas.ArrowLeft) girar(1.4 * dt);
        if (teclas.d || teclas.ArrowRight) girar(-1.4 * dt);
      }
      animarEmpaques(dt);
      actualizarFantasma();
      if (botonPantalla) mostrarPanel();
      panel.visible = performance.now() < panelHasta;
      if (panel.visible) ubicarPanel();
      renderer.render(scene, camera);
    });
  })();
  </script>
</body>
</html>
