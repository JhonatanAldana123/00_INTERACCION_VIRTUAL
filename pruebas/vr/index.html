<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#03040A">
  <title>Prueba VR · Exhibidor Sello Rojo</title>
  <!-- Página de PRUEBA para Oculus Go / Quest (WebXR). No la usa ningún QR.
       three.js r147 en versión clásica (sin módulos) para que funcione en navegadores viejos. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03040A; color: #E8EBF4;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    #panel { position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px 24px; z-index: 5;
      background: linear-gradient(to bottom, rgba(3,4,10,0.85), rgba(3,4,10,0)); pointer-events: none; }
    #panel h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #00E5C8; }
    #panel p { margin: 0; font-size: 13px; color: rgba(232,235,244,.7); }
    #boton { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 6;
      padding: 16px 34px; font-size: 18px; font-weight: 700; color: #03040A; background: #00E5C8;
      border: 0; border-radius: 100px; cursor: pointer; display: none; }
    #log { position: fixed; left: 12px; bottom: 12px; right: 12px; z-index: 4; max-height: 32%; overflow: auto;
      font: 11px/1.4 Consolas, monospace; color: rgba(232,235,244,.55); pointer-events: none; white-space: pre-wrap; }
    #log .e { color: #ff7a7a; }
  </style>
</head>
<body>
  <div id="panel"><h1>Exhibidor Sello Rojo · prueba VR</h1><p id="estado">Cargando…</p></div>
  <button id="boton" type="button">Entrar en VR</button>
  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <script>
  (function () {
    'use strict';
    var logEl = document.getElementById('log');
    var estadoEl = document.getElementById('estado');
    var boton = document.getElementById('boton');
    function log(m, err) {
      var d = document.createElement('div');
      if (err) d.className = 'e';
      d.textContent = m;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.onerror = function (msg, src, line) { log('ERROR: ' + msg + ' (' + line + ')', true); };
    if (typeof THREE === 'undefined' || !THREE.GLTFLoader) {
      estadoEl.textContent = 'No se pudo cargar three.js (¿sin internet?).';
      log('Faltan las librerías three.js desde jsdelivr', true);
      return;
    }

    var params = new URLSearchParams(location.search);
    var GIRO = parseFloat(params.get('giro') || '0') * Math.PI / 180;      // gira el exhibidor al inicio
    var ESCALA = parseFloat(params.get('escala') || '1');                   // 1 = tamaño real
    var ALTURA_OJOS = 1.6;
    var ARCHIVO = 'exhibidor.glb';
    var VERSION = 'v5';                                   // sube este número en cada cambio
    // Productos para medir el rendimiento:  ?prod=caja (por defecto, caja roja liviana) · ?prod=real · ?prod=sin
    var PROD = params.get('prod') || 'real';
    var VIDRIO = params.get('vidrio') !== '0';            // ?vidrio=0 quita los vidrios del exhibidor
    document.title = 'Prueba VR ' + VERSION;
    log('Versión ' + VERSION + ' · productos: ' + PROD);

    log('UA: ' + navigator.userAgent);
    log('navigator.xr: ' + (navigator.xr ? 'sí' : 'NO'));

    // ---------- escena ----------
    // Ajustes de rendimiento por la dirección:  ?aa=0 (sin suavizado de bordes)  ?res=0.8 (menos resolución)  ?pbr=1 (materiales completos)
    var AA = params.get('aa') !== '0';
    var RES = parseFloat(params.get('res') || '1.2');        // >1 = más nitidez (se dibuja a mayor resolución y se reduce)
    var FOVEA = parseFloat(params.get('fovea') || '0');      // 0 = sin degradado en los bordes de la vista (más nítido); 1 = máximo ahorro
    var PBR = params.get('pbr') === '1';
    var renderer = new THREE.WebGLRenderer({ antialias: AA, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    if (renderer.xr.setFramebufferScaleFactor) renderer.xr.setFramebufferScaleFactor(RES);
    if (renderer.xr.setFoveation) renderer.xr.setFoveation(FOVEA);
    log('Suavizado: ' + (AA ? 'sí' : 'no') + ' · resolución VR: ' + RES + ' · foveación: ' + FOVEA + ' · materiales: ' + (PBR ? 'completos' : 'livianos'));
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03040a);
    scene.fog = new THREE.Fog(0x03040a, 14, 40);
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
    scene.add(camera);

    // El suelo queda ALTURA_OJOS por debajo de la cabeza (en VR 'local' el origen es la cabeza al iniciar)
    var world = new THREE.Group();
    world.position.y = -ALTURA_OJOS;
    scene.add(world);

    // ---------- estación oscura ----------
    scene.add(new THREE.HemisphereLight(0x8fa3c9, 0x05060a, 0.75));
    var sol = new THREE.DirectionalLight(0xffffff, 0.9);
    sol.position.set(2, 6, 3);
    scene.add(sol);
    var relleno = new THREE.PointLight(0x00e5c8, 0.9, 7);
    relleno.position.set(0, 0.4, -2.2);
    world.add(relleno);

    var piso = new THREE.Mesh(new THREE.CircleGeometry(7, 48),
      new THREE.MeshStandardMaterial({ color: 0x0b0e18, roughness: 0.55, metalness: 0.5 }));
    piso.rotation.x = -Math.PI / 2;
    world.add(piso);
    [2.6, 4.6, 6.6].forEach(function (r, i) {
      var anillo = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.03, 64),
        new THREE.MeshBasicMaterial({ color: i === 0 ? 0x00e5c8 : 0x0b6b60 }));
      anillo.rotation.x = -Math.PI / 2; anillo.position.y = 0.005;
      world.add(anillo);
    });
    for (var a = 0; a < 12; a++) {   // líneas radiales
      var linea = new THREE.Mesh(new THREE.PlaneGeometry(0.02, 4), new THREE.MeshBasicMaterial({ color: 0x0b3f3a }));
      linea.rotation.x = -Math.PI / 2; linea.rotation.z = a * Math.PI / 6;
      linea.position.set(Math.sin(a * Math.PI / 6) * 4.6, 0.004, Math.cos(a * Math.PI / 6) * 4.6);
      linea.rotation.z = -a * Math.PI / 6;
      world.add(linea);
    }
    // arcos de la estación
    for (var k = 0; k < 6; k++) {
      var arco = new THREE.Mesh(new THREE.TorusGeometry(8.5, 0.07, 6, 48, Math.PI),
        new THREE.MeshBasicMaterial({ color: 0x0a5a50 }));
      arco.position.z = 4 - k * 4.5;
      world.add(arco);
    }
    // estrellas
    var pos = new Float32Array(1400 * 3);
    for (var s = 0; s < 1400; s++) {
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, rr = 45 + Math.random() * 25;
      var q = Math.sqrt(1 - u * u);
      pos[s * 3] = rr * q * Math.cos(th); pos[s * 3 + 1] = Math.abs(rr * u) + 2; pos[s * 3 + 2] = rr * q * Math.sin(th);
    }
    var gEst = new THREE.BufferGeometry();
    gEst.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(gEst, new THREE.PointsMaterial({ color: 0xcfe9ff, size: 0.18, fog: false })));

    // charco de luz bajo el exhibidor
    var cv = document.createElement('canvas'); cv.width = cv.height = 256;
    var cx = cv.getContext('2d');
    var gr = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(0,229,200,0.45)'); gr.addColorStop(1, 'rgba(0,229,200,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
    var charco = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
    charco.rotation.x = -Math.PI / 2; charco.position.set(0, 0.008, -2.2);
    world.add(charco);

    // letrero en el piso con las instrucciones
    function textoTextura(lineas, w, h) {
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var g = c.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,0)'; g.fillRect(0, 0, w, h);
      g.textAlign = 'center'; g.fillStyle = '#00E5C8';
      g.font = 'bold ' + Math.round(h * 0.26) + 'px sans-serif';
      g.fillText(lineas[0], w / 2, h * 0.38);
      g.fillStyle = 'rgba(232,235,244,0.85)';
      g.font = Math.round(h * 0.17) + 'px sans-serif';
      for (var i = 1; i < lineas.length; i++) g.fillText(lineas[i], w / 2, h * (0.38 + 0.22 * i));
      return new THREE.CanvasTexture(c);
    }
    var letrero = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.6),
      new THREE.MeshBasicMaterial({ map: textoTextura(['EMPAQUES · ' + VERSION, 'Gatillo: sacar un empaque (al soltar vuelve)',
          'Trackpad: ◄ ► gira · ▲ ▼ avanza  |  Panel: escala'], 1024, 384),
        transparent: true, depthWrite: false }));
    letrero.rotation.x = -Math.PI / 2; letrero.position.set(0, 0.012, -0.9);
    world.add(letrero);

    // ---------- panel de control (escala, acercarse, girar) ----------
    // Vive en el espacio de la persona (no en el mundo), abajo a la izquierda, al alcance del rayo.
    var BOTONES = [
      { id: 'esc-', texto: 'Escala −', c: 0, f: 0, w: 1 }, { id: 'esc+', texto: 'Escala +', c: 1, f: 0, w: 1 },
      { id: 'acerca', texto: 'Acercar ▲', c: 2, f: 0, w: 1 }, { id: 'aleja', texto: 'Alejar ▼', c: 3, f: 0, w: 1 },
      { id: 'giraI', texto: '◄ Girar', c: 0, f: 1, w: 1 }, { id: 'giraD', texto: 'Girar ►', c: 1, f: 1, w: 1 },
      { id: 'reset', texto: 'Reiniciar', c: 2, f: 1, w: 2 }
    ];
    var PW = 1024, PH = 400, COLS = 4, FILAS = 2, MARGEN = 14;
    var panelCv = document.createElement('canvas'); panelCv.width = PW; panelCv.height = PH;
    var panelCx = panelCv.getContext('2d');
    var panelTex = new THREE.CanvasTexture(panelCv);
    var botonHover = null, botonActivo = null;
    function rectBoton(b) {
      var cw = PW / COLS, ch = PH / FILAS;
      return { x: b.c * cw + MARGEN, y: b.f * ch + MARGEN, w: b.w * cw - MARGEN * 2, h: ch - MARGEN * 2 };
    }
    function pintarPanel() {
      panelCx.clearRect(0, 0, PW, PH);
      panelCx.fillStyle = 'rgba(6,10,18,0.82)'; panelCx.fillRect(0, 0, PW, PH);
      panelCx.textAlign = 'center'; panelCx.textBaseline = 'middle'; panelCx.font = 'bold 52px sans-serif';
      BOTONES.forEach(function (b) {
        var r = rectBoton(b);
        var vivo = (b.id === botonActivo), sobre = (b.id === botonHover);
        panelCx.fillStyle = vivo ? '#00E5C8' : sobre ? 'rgba(0,229,200,0.35)' : 'rgba(255,255,255,0.10)';
        panelCx.fillRect(r.x, r.y, r.w, r.h);
        panelCx.strokeStyle = 'rgba(0,229,200,0.7)'; panelCx.lineWidth = 3; panelCx.strokeRect(r.x, r.y, r.w, r.h);
        panelCx.fillStyle = vivo ? '#03040A' : '#E8EBF4';
        panelCx.fillText(b.texto, r.x + r.w / 2, r.y + r.h / 2);
      });
      panelTex.needsUpdate = true;
    }
    pintarPanel();
    var panel = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8 * PH / PW),
      new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, depthWrite: false }));
    panel.position.set(-0.45, -0.38, -0.8);
    panel.rotation.set(-0.55, 0.45, 0);
    panel.renderOrder = 10;
    scene.add(panel);
    function botonEnUv(uv) {
      var x = uv.x * PW, y = (1 - uv.y) * PH;
      for (var i = 0; i < BOTONES.length; i++) {
        var r = rectBoton(BOTONES[i]);
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return BOTONES[i].id;
      }
      return null;
    }
    function marcarBotones(hover, activo) {
      if (hover === botonHover && activo === botonActivo) return;
      botonHover = hover; botonActivo = activo; pintarPanel();
    }

    // ---------- navegación: escala del exhibidor, acercarse/alejarse y giro ----------
    var ESC_MIN = 0.4, ESC_MAX = 5;
    var rumbo = new THREE.Vector3();
    function rumboCabeza() {
      var cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      cam.getWorldDirection(rumbo); rumbo.y = 0;
      if (rumbo.lengthSq() < 1e-6) rumbo.set(0, 0, -1);
      return rumbo.normalize();
    }
    function avanzar(metros) {                       // positivo = hacia donde mira; se mueve el mundo al revés
      var d = rumboCabeza();
      world.position.x -= d.x * metros; world.position.z -= d.z * metros;
    }
    function escalar(factor) {
      var p = contenedor.userData.pivote;
      if (!p) return;
      var s = Math.max(ESC_MIN, Math.min(ESC_MAX, p.scale.x * factor));
      p.scale.setScalar(s);
    }
    function girar(rad) { if (contenedor.userData.pivote) contenedor.userData.pivote.rotation.y += rad; }
    function reiniciar() {
      world.position.set(0, -ALTURA_OJOS, 0);
      var p = contenedor.userData.pivote;
      if (p) { p.scale.setScalar(1); p.rotation.y = GIRO; }
    }
    function aplicarBoton(id, dt) {                  // se llama cada cuadro mientras el botón está presionado
      if (id === 'esc+') escalar(Math.pow(1.7, dt));
      else if (id === 'esc-') escalar(Math.pow(1.7, -dt));
      else if (id === 'acerca') avanzar(1.2 * dt);
      else if (id === 'aleja') avanzar(-1.2 * dt);
      else if (id === 'giraI') girar(1.4 * dt);
      else if (id === 'giraD') girar(-1.4 * dt);
    }

    // ---------- carga del exhibidor ----------
    var contenedor = new THREE.Group();   // se puede girar con el trackpad
    world.add(contenedor);
    var empaques = [];                    // holders (grupo centrado en cada empaque)
    var mallasEmpaque = [];
    var tmpBox = new THREE.Box3();

    var draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/draco/gltf/');
    var loader = new THREE.GLTFLoader();
    loader.setDRACOLoader(draco);
    // ---- optimización en la carga: en el Go lo que más pesa son las llamadas de dibujo, no los triángulos ----
    var anisotropia = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    function liviano(m) {                       // PBR -> Lambert (mucho más barato en el Go)
      if (PBR || !m.isMeshStandardMaterial) return m.clone();
      var n = new THREE.MeshLambertMaterial({
        name: m.name, color: m.color.clone(), map: m.map, emissive: m.emissive.clone(), emissiveMap: m.emissiveMap,
        emissiveIntensity: m.emissiveIntensity, transparent: m.transparent, opacity: m.opacity,
        side: m.side, alphaTest: m.alphaTest, depthWrite: m.depthWrite
      });
      return n;
    }
    function afinar(m) { if (m.map) m.map.anisotropy = anisotropia; return m; }
    // junta varias mallas (en el espacio local de 'raiz') en una sola; null si no se puede
    function fusionar(partes, raiz) {
      var inv = new THREE.Matrix4().copy(raiz.matrixWorld).invert();
      var geos = [];
      for (var i = 0; i < partes.length; i++) {
        var p = partes[i];
        var g = p.geometry.clone();
        ['color', 'uv2', 'tangent'].forEach(function (a) { if (g.attributes[a]) g.deleteAttribute(a); });
        var rel = new THREE.Matrix4().multiplyMatrices(inv, p.matrixWorld);
        g.applyMatrix4(rel);
        if (rel.determinant() < 0 && g.index) {          // espejo: se invierte el orden de los triángulos
          var ix = g.index.array;
          for (var t = 0; t < ix.length; t += 3) { var tmp = ix[t]; ix[t] = ix[t + 2]; ix[t + 2] = tmp; }
        }
        geos.push(g);
      }
      return THREE.BufferGeometryUtils.mergeBufferGeometries(geos, false);
    }

    loader.load(ARCHIVO, function (gltf) {
      var modelo = gltf.scene;
      modelo.scale.setScalar(ESCALA);
      modelo.updateMatrixWorld(true);

      // 1) nodos de empaque = padres de las partes con material "SELLO ROJO"
      var nodosEmpaque = [];
      modelo.traverse(function (o) {
        if (!o.isMesh) return;
        var nm = (o.material && o.material.name) || '';
        var p = o.parent;
        if (nm.indexOf('SELLO ROJO') >= 0 && p && p !== modelo && nodosEmpaque.indexOf(p) < 0) nodosEmpaque.push(p);
      });
      var llamadasAntes = 0;
      modelo.traverse(function (o) { if (o.isMesh) llamadasAntes++; });

      // 2) cada empaque (≈51 partes) pasa a UNA sola malla
      nodosEmpaque.forEach(function (nodo) {
        var partes = [];
        nodo.traverse(function (o) { if (o.isMesh) partes.push(o); });
        nodo.updateWorldMatrix(true, true);
        var geo = partes.length > 1 ? fusionar(partes, nodo) : null;
        if (!geo) return;
        var mat = afinar(liviano(partes[0].material));
        partes.forEach(function (p) { p.parent.remove(p); });
        nodo.add(new THREE.Mesh(geo, mat));
      });

      // 3) el resto del exhibidor (estático) se junta por material
      var grupos = {};
      var ordenGrupos = [];
      modelo.traverse(function (o) {
        if (!o.isMesh) return;
        for (var a = o.parent; a; a = a.parent) if (nodosEmpaque.indexOf(a) >= 0) return;   // ya son parte de un empaque
        var id = o.material.uuid;
        if (!grupos[id]) { grupos[id] = []; ordenGrupos.push(id); }
        grupos[id].push(o);
      });
      ordenGrupos.forEach(function (id) {
        var partes = grupos[id];
        var mat = afinar(liviano(partes[0].material));
        var geo = partes.length > 1 ? fusionar(partes, modelo) : null;
        if (!geo) { partes.forEach(function (p) { p.material = mat; }); return; }
        var m = new THREE.Mesh(geo, mat);
        partes.forEach(function (p) { p.parent.remove(p); });
        modelo.add(m);
      });
      if (!VIDRIO) modelo.traverse(function (o) { if (o.isMesh && /GLASS/.test(o.material.name || '')) o.visible = false; });
      var llamadasDespues = 0;
      modelo.traverse(function (o) { if (o.isMesh) llamadasDespues++; });
      log('Mallas (llamadas de dibujo): ' + llamadasAntes + ' → ' + llamadasDespues);
      modelo.updateMatrixWorld(true);
      var caja = new THREE.Box3().setFromObject(modelo);
      var size = caja.getSize(new THREE.Vector3());
      var centro = caja.getCenter(new THREE.Vector3());
      modelo.position.set(-centro.x, -caja.min.y, -centro.z);
      var pivote = new THREE.Group();
      pivote.add(modelo);
      pivote.rotation.y = GIRO;
      pivote.position.set(0, 0, -(Math.max(size.x, size.z) / 2 + 1.3));
      contenedor.add(pivote);
      contenedor.userData.pivote = pivote;
      pivote.updateMatrixWorld(true);
      log('Exhibidor: ' + size.x.toFixed(2) + ' × ' + size.y.toFixed(2) + ' × ' + size.z.toFixed(2) + ' m');
      relleno.position.copy(pivote.position).setY(0.5);
      charco.position.x = pivote.position.x; charco.position.z = pivote.position.z;

      // Cada empaque del glb es un nodo con ~51 partes (todas con el material "SELLO ROJO")
      var triangulos = 0;
      modelo.traverse(function (o) {
        if (!o.isMesh) return;
        var g = o.geometry;
        triangulos += (g.index ? g.index.count : g.attributes.position.count) / 3;
      });
      log('Triángulos totales: ' + Math.round(triangulos));

      // Cada empaque se envuelve en un grupo centrado en su caja, para poder agarrarlo por el centro
      nodosEmpaque.forEach(function (nodo) {
        nodo.updateWorldMatrix(true, true);
        tmpBox.setFromObject(nodo);
        var centroMundo = tmpBox.getCenter(new THREE.Vector3());
        var padre = nodo.parent;
        var holder = new THREE.Group();
        padre.add(holder);
        padre.updateWorldMatrix(true, false);
        holder.position.copy(padre.worldToLocal(centroMundo.clone()));
        holder.updateMatrixWorld(true);
        holder.attach(nodo);
        var partes = [];
        if (PROD === 'caja') {                   // caja roja del mismo tamaño: 12 triángulos y sin textura
          nodo.traverse(function (m) {
            if (!m.isMesh) return;
            m.geometry.computeBoundingBox();
            var bb = m.geometry.boundingBox, sz = bb.getSize(new THREE.Vector3()), ce = bb.getCenter(new THREE.Vector3());
            var cg = new THREE.BoxGeometry(sz.x, sz.y, sz.z);
            cg.translate(ce.x, ce.y, ce.z);
            m.geometry = cg;
            m.material = new THREE.MeshLambertMaterial({ color: 0xc0121a });
          });
        }
        nodo.traverse(function (m) {
          if (m.isMesh) { partes.push(m); mallasEmpaque.push(m); }
        });
        if (PROD === 'sin') { nodo.visible = false; partes.forEach(function () { mallasEmpaque.pop(); }); partes = []; }
        holder.userData = {
          esHolder: true, partes: partes, estado: 'reposo', padre: padre,
          pos0: holder.position.clone(), quat0: holder.quaternion.clone(), esc0: holder.scale.clone()
        };
        empaques.push(holder);
      });
      log('Empaques sueltos: ' + empaques.length + (empaques.length ? '' : ' (no se encontraron)'), empaques.length === 0);
      estadoEl.textContent = empaques.length + ' empaques · ' +
        (renderer.xr.isPresenting ? 'apunta con el mando' : 'arrastra para mirar, clic en un empaque');
    }, function (xhr) {
      if (xhr.total) estadoEl.textContent = 'Cargando ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
    }, function (e) { log('No se pudo cargar ' + ARCHIVO + ': ' + (e && e.message ? e.message : e), true); });

    // ---------- interacción ----------
    var raycaster = new THREE.Raycaster();
    raycaster.far = 6;
    var tmpMat = new THREE.Matrix4();
    var controles = [];
    function holderDe(malla) {
      var o = malla;
      while (o && !(o.userData && o.userData.esHolder)) o = o.parent;
      return o;
    }

    function resaltar(holder, si) {
      holder.userData.partes.forEach(function (p) {
        var m = p.material;
        if ('emissive' in m) { m.emissive.setHex(si ? 0x00e5c8 : 0x000000); m.emissiveIntensity = si ? 0.35 : 0; }
      });
    }
    function agarrar(holder, padreNuevo, posLocal) {
      var u = holder.userData;
      padreNuevo.attach(holder);
      u.estado = 'agarrado'; u.destino = posLocal; u.escDestino = 1.8; u.agarradoPor = padreNuevo;
    }
    function soltar(holder) {
      var u = holder.userData;
      u.padre.attach(holder);
      u.estado = 'regreso'; u.agarradoPor = null;
      resaltar(holder, false);
    }

    function crearControl(i) {
      var c = renderer.xr.getController(i);
      var rayo = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
        new THREE.LineBasicMaterial({ color: 0x00e5c8 }));
      rayo.scale.z = 3;
      c.add(rayo);
      var cuerpo = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.12), new THREE.MeshStandardMaterial({ color: 0x20242e }));
      cuerpo.position.z = 0.05;
      c.add(cuerpo);
      var punto = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      punto.visible = false;
      scene.add(punto);
      var estado = { obj: c, rayo: rayo, punto: punto, hover: null, agarrado: null, hoverBoton: null, boton: null };
      c.addEventListener('selectstart', function () {
        if (estado.agarrado || estado.boton) return;
        if (estado.hoverBoton) {                       // gatillo sobre un botón del panel
          estado.boton = estado.hoverBoton;
          if (estado.boton === 'reset') reiniciar();
          return;
        }
        if (estado.hover && estado.hover.userData.estado !== 'agarrado') {
          estado.agarrado = estado.hover;
          agarrar(estado.agarrado, c, new THREE.Vector3(0, 0, -0.55));
        }
      });
      c.addEventListener('selectend', function () {
        estado.boton = null;
        if (estado.agarrado) { soltar(estado.agarrado); estado.agarrado = null; }
      });
      scene.add(c);
      controles.push(estado);
    }
    crearControl(0); crearControl(1);

    function actualizarApuntado() {
      controles.forEach(function (e) {
        var c = e.obj;
        if (!c.visible) { e.punto.visible = false; return; }
        var previo = e.hover;
        e.hover = null;
        e.hoverBoton = null;
        var largo = 3;
        if (!e.agarrado) {
          tmpMat.identity().extractRotation(c.matrixWorld);
          raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
          raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
          var blancos = mallasEmpaque.concat([panel]);
          var hits = raycaster.intersectObjects(blancos, false);
          if (hits.length) {
            if (hits[0].object === panel) {
              e.hoverBoton = botonEnUv(hits[0].uv);
              largo = hits[0].distance;
              e.punto.position.copy(hits[0].point); e.punto.visible = true;
            } else {
              var h = holderDe(hits[0].object);
              if (h.userData.estado !== 'agarrado') {
                e.hover = h; largo = hits[0].distance;
                e.punto.position.copy(hits[0].point); e.punto.visible = true;
              }
            }
          }
        }
        if (!e.hover && !e.hoverBoton) e.punto.visible = false;
        if (previo !== e.hover) { if (previo) resaltar(previo, false); if (e.hover) resaltar(e.hover, true); }
        e.rayo.scale.z = e.agarrado ? 0.5 : largo;
      });
      var hb = null, ab = null;
      controles.forEach(function (e) { if (e.hoverBoton && !hb) hb = e.hoverBoton; if (e.boton && !ab) ab = e.boton; });
      marcarBotones(hb, ab);
    }

    // animación de empaques (agarrado → hacia la mano · regreso → a su lugar)
    function animarEmpaques(dt) {
      var k = 1 - Math.exp(-12 * dt);
      var qId = new THREE.Quaternion();
      empaques.forEach(function (h) {
        var u = h.userData;
        if (u.estado === 'agarrado') {
          h.position.lerp(u.destino, k);
          h.quaternion.slerp(qId, k);
          var s = h.scale.x + (u.escDestino * u.esc0.x - h.scale.x) * k;
          h.scale.setScalar(s);
        } else if (u.estado === 'regreso') {
          h.position.lerp(u.pos0, k);
          h.quaternion.slerp(u.quat0, k);
          h.scale.lerp(u.esc0, k);
          if (h.position.distanceTo(u.pos0) < 0.002 && Math.abs(h.scale.x - u.esc0.x) < 0.002) {
            h.position.copy(u.pos0); h.quaternion.copy(u.quat0); h.scale.copy(u.esc0);
            u.estado = 'reposo';
          }
        }
      });
    }

    // trackpad: ◄ ► gira el exhibidor · ▲ ▼ avanza o retrocede hacia donde mira (si ninguna mano sostiene un empaque)
    function leerTrackpad(dt) {
      var ses = renderer.xr.getSession && renderer.xr.getSession();
      if (!ses || !contenedor.userData.pivote) return;
      var alguno = controles.some(function (e) { return e.agarrado; });
      if (alguno) return;
      for (var i = 0; i < ses.inputSources.length; i++) {
        var gp = ses.inputSources[i].gamepad;
        if (gp && gp.axes && gp.axes.length >= 2) {
          var x = gp.axes[0], y = gp.axes[1];
          if (Math.abs(x) > 0.4) girar(-x * dt * 1.4);
          if (Math.abs(y) > 0.4) avanzar(-y * dt * 1.2);
        }
      }
    }

    // ---------- modo pantalla (PC / celular): arrastrar para mirar, clic para sacar un empaque ----------
    var yaw = 0, pitch = 0, arrastrando = false, movido = false, px = 0, py = 0;
    var sostenido = null;
    var dom = renderer.domElement;
    var botonPantalla = null;                        // botón del panel presionado con el ratón o el dedo
    var teclas = {};
    dom.addEventListener('pointerdown', function (e) {
      if (!renderer.xr.isPresenting) {
        var r0 = dom.getBoundingClientRect();
        raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r0.left) / r0.width) * 2 - 1, -((e.clientY - r0.top) / r0.height) * 2 + 1), camera);
        var hp = raycaster.intersectObject(panel, false);
        if (hp.length) {
          var idp = botonEnUv(hp[0].uv);
          if (idp) { botonPantalla = idp; if (idp === 'reset') reiniciar(); marcarBotones(null, idp); return; }
        }
      }
      arrastrando = true; movido = false; px = e.clientX; py = e.clientY;
    });
    dom.addEventListener('wheel', function (e) { escalar(e.deltaY < 0 ? 1.1 : 1 / 1.1); e.preventDefault(); }, { passive: false });
    window.addEventListener('keyup', function (e) { teclas[e.key] = false; });
    window.addEventListener('pointerup', function (e) {
      if (botonPantalla) { botonPantalla = null; marcarBotones(null, null); return; }
      if (!arrastrando) return;
      arrastrando = false;
      if (movido || renderer.xr.isPresenting) return;
      if (sostenido) { soltar(sostenido); sostenido = null; return; }
      var r = dom.getBoundingClientRect();
      var ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObjects(mallasEmpaque, false);
      if (hits.length) { sostenido = holderDe(hits[0].object); agarrar(sostenido, camera, new THREE.Vector3(0, 0, -0.7)); }
    });
    window.addEventListener('pointermove', function (e) {
      if (!arrastrando) return;
      var dx = e.clientX - px, dy = e.clientY - py;
      if (Math.abs(dx) + Math.abs(dy) > 3) movido = true;
      px = e.clientX; py = e.clientY;
      yaw -= dx * 0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.005));
    });
    window.addEventListener('keydown', function (e) {
      teclas[e.key] = true;
      if (e.key === 'Escape' && sostenido) { soltar(sostenido); sostenido = null; }
    });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- botón Entrar en VR ----------
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
        log('immersive-vr soportado: ' + (ok ? 'sí' : 'NO'), !ok);
        if (!ok) return;
        boton.style.display = 'block';
        boton.addEventListener('click', function () {
          navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] }).then(function (ses) {
            renderer.xr.setSession(ses);
          }).catch(function (e) { log('No se pudo iniciar VR: ' + e.message, true); });
        });
      }).catch(function (e) { log('isSessionSupported falló: ' + e.message, true); });
    } else {
      log('Este navegador no tiene WebXR: solo se verá en modo pantalla.', true);
    }
    renderer.xr.addEventListener('sessionstart', function () {
      document.getElementById('panel').style.display = 'none'; boton.style.display = 'none'; logEl.style.display = 'none';
      if (sostenido) { soltar(sostenido); sostenido = null; }
      if (renderer.xr.setFoveation) renderer.xr.setFoveation(FOVEA);
    });
    renderer.xr.addEventListener('sessionend', function () {
      document.getElementById('panel').style.display = ''; boton.style.display = 'block'; logEl.style.display = '';
    });

    // ---------- bucle ----------
    var reloj = new THREE.Clock();
    renderer.setAnimationLoop(function () {
      var dt = Math.min(reloj.getDelta(), 0.1);
      if (!renderer.xr.isPresenting) {
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
        camera.position.set(0, 0, 0);
      } else {
        actualizarApuntado();
        leerTrackpad(dt);
        controles.forEach(function (e) { if (e.boton) aplicarBoton(e.boton, dt); });
      }
      if (!renderer.xr.isPresenting) {
        if (botonPantalla) aplicarBoton(botonPantalla, dt);
        if (teclas.w || teclas.ArrowUp) avanzar(1.2 * dt);
        if (teclas.s || teclas.ArrowDown) avanzar(-1.2 * dt);
        if (teclas.a || teclas.ArrowLeft) girar(1.4 * dt);
        if (teclas.d || teclas.ArrowRight) girar(-1.4 * dt);
      }
      animarEmpaques(dt);
      renderer.render(scene, camera);
    });
  })();
  </script>
</body>
</html>
