<!DOCTYPE html>
<html lang="es">
<head>
  <base href="../../">
  <script>window.PRESET = {"coleccion":"sello-rojo","pieza":"01-isla-2x2"};</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Barra del navegador del mismo negro del visor, para que se integre con la pantalla -->
  <meta name="theme-color" content="#005C7E">
  <meta name="color-scheme" content="dark">
  <title>Interacción Virtual AR</title>

  <!-- Tipografía de la tarjeta impresa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;500;700&display=swap">

  <!-- model-viewer: maneja .glb (Android) y .usdz (iOS) con AR nativo -->
  <!-- Versión fija para que una actualización de la librería no rompa el visor -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"></script>

  <style>
    /* ─── TOKENS ─────────────────────────────────────── */
    /* Mismo arte de la tarjeta impresa y de la pantalla de inicio de la Tarjeta AR (pruebas/tarjeta/):
       azul plano, triángulos, flecha y tipografía Ubuntu. */
    :root {
      --bg:       #005C7E;
      --fg:       #FFFFFF;
      --fg-dim:   rgba(255,255,255,0.78);
      --accent:   #93C01F;
      --cian:     #0091B5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;   /* sin "tirar para recargar" mientras se gira el modelo */
      background: var(--bg);
      color: var(--fg);
      font-family: 'Ubuntu', -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── PÁGINA ──────────────────────────────────────── */
    /* Pensada para celular vertical: los tamaños salen del ancho (vw) con tope por el alto (vh), para que
       todo quepa sin desplazar. De arriba abajo: nombres, recuadro con la pieza, selector (si la campaña
       tiene varias piezas), textos y botón de AR. */
    .pagina {
      position: fixed; inset: 0; overflow: hidden; background: var(--bg); text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      --tri: min(11vw, 7.5vh);          /* ancho de los triángulos; los nombres arrancan a su derecha, a su altura */
      padding: max(env(safe-area-inset-top, 0px), calc(var(--tri) * 1.65)) 6vw max(env(safe-area-inset-bottom, 0px), 3.5vh);
    }
    .pagina > * { position: relative; z-index: 1; }
    .pagina .triangulos { position: absolute; left: 0; top: 0; width: var(--tri); height: auto; z-index: 0; }
    .pagina .flecha { position: absolute; left: 0; bottom: 0; width: 27vw; max-width: 19vh; height: auto; z-index: 0; pointer-events: none; }
    .titulos {
      display: flex; flex-direction: column; min-height: 2.3em;
      align-self: stretch; text-align: left; margin-left: calc(var(--tri) - 2vw);
      font-weight: 700; font-size: clamp(16px, 5.6vw, 3.4vh); line-height: 1.18; text-transform: uppercase;
    }
    .titulos .campana { color: var(--accent); }

    /* ─── VISOR 3D ────────────────────────────────────── */
    .cuadro {
      flex: none; width: min(82vw, 40vh); aspect-ratio: 436 / 500; border-radius: 9%; overflow: hidden; margin: 1.5vh 0;
      background: radial-gradient(circle at 50% 42%, #fff 50%, #e9edf1); box-shadow: 0 8px 26px rgba(0,0,0,.2);
    }
    .pagina.varias .cuadro { width: min(82vw, 36vh); }      /* deja sitio al selector de piezas */
    model-viewer {
      display: block; width: 100%; height: 100%;
      background: transparent;
      --poster-color: transparent;
      --progress-bar-color: var(--accent);
      --progress-bar-height: 3px;
    }

    /* Ocultar el botón AR nativo de model-viewer (usamos el nuestro) */
    model-viewer::part(default-ar-button) { display: none; }

    /* ─── TEXTOS Y BOTÓN DE AR ────────────────────────── */
    .texto h1 { font-size: clamp(17px, 5vw, 3.1vh); font-weight: 500; line-height: 1.25; }
    .hint {
      margin-top: .7vh; font-size: clamp(9.5px, 3.05vw, 1.9vh); line-height: 1.5; color: rgba(255,255,255,.9);
      white-space: nowrap;          /* dos líneas exactas */
    }

    .ar-btn {
      display: flex;
      align-items: center;
      gap: .4em;
      background: var(--accent);
      color: #005C7E;
      border: none;
      border-radius: 100px;
      padding: .28em 1.05em .34em;
      font-size: clamp(19px, 6vw, 3.8vh);
      line-height: 1.1;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .ar-btn svg { width: .9em; height: .9em; }
    .ar-btn:active { transform: scale(0.96); }

    /* Celular acostado (o computador): la pieza a la izquierda y lo demás a la derecha */
    @media (orientation: landscape) {
      .pagina {
        display: grid; grid-template-columns: auto minmax(0, 1fr); grid-auto-rows: auto;
        column-gap: 5vw; row-gap: 3vh; align-content: center; justify-items: center; padding: 4vh 6vw 4vh 9vw;
      }
      .pagina .cuadro, .pagina.varias .cuadro { grid-column: 1; grid-row: 1 / span 4; width: auto; height: min(90vh, 46vw); margin: 0; }
      .titulos, .picker, .texto, .ar-btn { grid-column: 2; }
      .titulos { font-size: clamp(15px, 6.4vh, 3.4vw); margin-left: 0; justify-self: stretch; }
      .texto h1 { font-size: clamp(15px, 5.6vh, 3vw); }
      .hint { font-size: clamp(9px, 3.4vh, 1.42vw); }
      .ar-btn { font-size: clamp(17px, 6.6vh, 3.4vw); }
      .pagina .triangulos { width: 7vh; }
      .pagina .flecha { max-width: none; width: 26vh; }
    }

    /* ─── PANTALLA BIENVENIDA (sin ?modelo) ────────────── */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      text-align: center;
      padding: 40px 32px;
      gap: 0;
    }

    .screen-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      opacity: 0.6;
    }

    .screen h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .screen p {
      font-size: 14px;
      color: var(--fg-dim);
      max-width: 260px;
      line-height: 1.6;
    }

    .screen .vr-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      padding: 14px 28px;
      border-radius: 100px;
      background: var(--accent);
      color: #005C7E;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .screen .vr-link[hidden] { display: none; }

    .screen .badge {
      margin-top: 24px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(147,192,31,0.5);
      padding: 5px 12px;
      border-radius: 100px;
    }

    /* ─── LOADING ─────────────────────────────────────── */
    .loading {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity 0.4s ease;
    }

    .loading.fade { opacity: 0; pointer-events: none; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SELECTOR DE COLECCIÓN ───────────────────────── */
    .picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4vw;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .nav-btn {
      flex: none;
      width: clamp(34px, 9.5vw, 5vh);
      height: clamp(34px, 9.5vw, 5vh);
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.55);
      background: rgba(0,38,56,0.25);
      color: var(--fg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .nav-btn:active { transform: scale(0.92); border-color: var(--accent); }

    .picker-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .picker-name {
      font-size: clamp(11px, 3.2vw, 1.9vh);
      font-weight: 500;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .picker.cargando .picker-name { opacity: 0.45; }

    .dots { display: flex; gap: 6px; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transition: background 0.2s ease, width 0.2s ease;
    }

    .dot.activo { width: 18px; border-radius: 3px; background: var(--accent); }

    /* ─── AVISO ───────────────────────────────────────── */
    .toast {
      position: fixed;
      left: 50%;
      top: max(env(safe-area-inset-top, 0px), 16px);
      transform: translateX(-50%);
      z-index: 40;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(0,38,56,0.95);
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 13px;
      text-align: center;
    }

    /* ─── UTILIDADES ──────────────────────────────────── */
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- ── PÁGINA: nombres, recuadro con la pieza, selector, textos y botón de AR ── -->
  <div class="pagina" id="pagina">
    <svg class="triangulos" viewBox="0 0 100 290" aria-hidden="true">
      <polygon points="0,0 100,0 0,72" fill="#0091B5"/><polygon points="0,78 100,150 0,228" fill="#93C01F"/><polygon points="100,150 100,290 0,228" fill="#0091B5"/>
    </svg>
    <img class="flecha" src="pruebas/tarjeta/portada-flecha.png?v=2" alt="">

    <div class="titulos"><span class="campana" id="tituloCampana">Innercia</span><span id="tituloPieza"></span></div>

    <!-- ── VISOR 3D ── -->
    <div class="cuadro">
      <model-viewer
        id="viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-usdz-max-texture-size="1024"
        camera-controls
        autoplay
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="10deg"
        interaction-prompt="none"
        shadow-intensity="1"
        shadow-softness="1"
        environment-image="neutral"
        tone-mapping="neutral"
        exposure="0.8"
        touch-action="none"
      ></model-viewer>
    </div>

    <!-- Selector de piezas: solo en campañas con 2 o más piezas -->
    <div class="picker" id="picker" hidden>
      <button class="nav-btn" id="prevBtn" aria-label="Pieza anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="picker-info">
        <span class="picker-name" id="pickerName"></span>
        <div class="dots" id="dots"></div>
      </div>
      <button class="nav-btn" id="nextBtn" aria-label="Pieza siguiente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="texto">
      <h1>Míralo en<br>tu espacio</h1>
      <p class="hint" id="hintText">&nbsp;<br>&nbsp;</p>
    </div>

    <button class="ar-btn" id="arBtn" onclick="activarAR()" hidden>
      <!-- Icono AR -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M12 8l-4 2.5v5L12 18l4-2.5v-5L12 8z"/>
      </svg>
      Ver en AR
    </button>
  </div>

  <!-- ── PANTALLA DE BIENVENIDA ── -->
  <div class="screen" id="welcome" hidden>
    <svg class="screen-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
      <polygon points="32,4 60,20 60,44 32,60 4,44 4,20" stroke-opacity="0.5"/>
      <polygon points="32,16 48,25 48,43 32,52 16,43 16,25"/>
      <circle cx="32" cy="34" r="5" fill="currentColor" opacity="0.4"/>
    </svg>
    <h1 id="welcomeTitle">Interacción Virtual</h1>
    <p id="welcomeMsg">Escanea el código QR de la presentación para visualizar el modelo en 3D y Realidad Aumentada.</p>
    <a class="vr-link" id="vrLink" href="pruebas/vr/" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h18a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-3.5a2 2 0 0 1-1.7-1l-.8-1.4a1.5 1.5 0 0 0-2.6 0l-.8 1.4a2 2 0 0 1-1.7 1H4a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1z"/></svg>
      Entrar al entorno VR
    </a>
    <span class="badge">iOS · Android · Web · Gafas VR</span>
  </div>

  <!-- ── AVISO ── -->
  <div class="toast" id="toast" hidden></div>

  <!-- ── LOADING ── -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>


  <script src="guia-ar.js"></script>
  <script>
    // ── Parámetros URL ──────────────────────────────────────
    // Dirección limpia (la genera scripts/generar-colecciones.js):  /campana-alpina/   y   /campana-alpina/bandeja01/
    // Campaña:    index.html?coleccion=campana-alpina           (todas sus piezas; colecciones.json)
    //             index.html?coleccion=campana-alpina&i=2       (abre en la 2.ª pieza)
    // Una pieza:  index.html?coleccion=campana-alpina&pieza=bandeja01
    // Un modelo:  index.html?modelo=Exh_opc_01                  (formato anterior: models/<id>/<id>.glb)
    // Dirección limpia (/alpina/ o /alpina/bandeja/): la página generada trae la campaña en window.PRESET
    const preset    = window.PRESET || {};
    const params    = new URLSearchParams(location.search);
    const modelo    = params.get('modelo');
    const coleccion = preset.coleccion || params.get('coleccion');
    const pieza     = preset.pieza || params.get('pieza');
    // Luz: &exposicion=0.7 la cambia solo en esta vista (la usa la vista previa de Flujo AR)
    const exposicionUrl = parseFloat(params.get('exposicion'));

    // ── Elementos ───────────────────────────────────────────
    const viewer     = document.getElementById('viewer');
    const loading    = document.getElementById('loading');
    const welcome    = document.getElementById('welcome');
    const pagina     = document.getElementById('pagina');
    const hintText   = document.getElementById('hintText');
    const arBtn      = document.getElementById('arBtn');
    const picker     = document.getElementById('picker');
    const pickerName = document.getElementById('pickerName');
    const dots       = document.getElementById('dots');
    const toast      = document.getElementById('toast');

    // ── Detección de OS ─────────────────────────────────────
    const isIOS     = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(navigator.userAgent);
    // ── Estado ──────────────────────────────────────────────
    let lista = [];          // [{ id, nombre }] — un solo elemento en modo modelo
    let actual = 0;
    let interfazVisible = false;

    // ── Flujo principal ─────────────────────────────────────
    // ── Nitidez ─────────────────────────────────────────────
    // El AR del navegador (WebXR) lo dibuja esta misma página, así que la calidad depende de lo que se haga aquí.
    // Dos cosas lo hacían ver «pixelado y con ruido» (16/11/2026):
    //  1. Las imágenes exportadas desde Rhino vienen sin mipmaps (versiones reducidas de cada imagen). Sin ellos,
    //     cuando la pieza se ve pequeña o lejos, cada punto de la pantalla toma un punto suelto de una imagen de
    //     2048 px y la gráfica chispea. Se activan los mipmaps y el filtro que afina las superficies inclinadas.
    //  2. El AR se dibuja a la resolución «recomendada» por Android, que es bastante menor que la de la pantalla.
    //     Se pide más (?nitidezar=1 vuelve a lo normal si un celular se pone lento).
    const LINEAL_CON_MIPMAPS = 9987;
    const interno = nombre => {
      for (let p = viewer; p; p = Object.getPrototypeOf(p)) {
        const s = Object.getOwnPropertySymbols(p).find(x => x.description === nombre);
        if (s) return viewer[s];
      }
      return null;
    };
    function afinarImagenes() {
      try {
        // Lo que model-viewer permite cambiar de forma oficial: el filtro de cada imagen
        for (const m of viewer.model.materials) {
          const pbr = m.pbrMetallicRoughness;
          for (const ti of [pbr.baseColorTexture, pbr.metallicRoughnessTexture, m.normalTexture, m.occlusionTexture, m.emissiveTexture]) {
            if (ti && ti.texture) ti.texture.sampler.setMinFilter(LINEAL_CON_MIPMAPS);
          }
        }
      } catch (e) { /* si cambia la versión de model-viewer, la pieza se ve igual que antes */ }
      try {
        // Y dos ajustes que model-viewer no expone: el afinado de superficies inclinadas y la resolución del AR
        const motor = interno('renderer'), escena = interno('scene');
        const tres = motor && motor.threeRenderer;
        if (!tres) return;
        const maximo = Math.min(8, tres.capabilities.getMaxAnisotropy());
        const vistas = new Set();
        if (escena) escena.traverse(o => {
          for (const mat of [].concat(o.material || [])) {
            for (const clave of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
              const t = mat[clave];
              if (!t || vistas.has(t)) continue;
              vistas.add(t);
              // Cambiar solo el filtro no basta: la imagen se cargó sin mipmaps. Se pide generarlos y se suelta
              // la copia que ya estaba en la tarjeta gráfica para que se vuelva a subir completa.
              if (t.generateMipmaps && t.anisotropy >= maximo) continue;
              t.generateMipmaps = true;
              t.minFilter = 1008;                // LinearMipmapLinearFilter de three
              t.anisotropy = maximo;
              t.dispose();
              t.needsUpdate = true;
            }
          }
        });
        const pintar = interno('needsRender');
        if (pintar) pintar.call(viewer);
        const pedida = parseFloat(new URLSearchParams(location.search).get('nitidezar'));
        if (tres.xr && !tres.xr.isPresenting) tres.xr.setFramebufferScaleFactor(pedida > 0 ? pedida : 2);
      } catch (e) { /* ídem */ }
    }

    // ── Vidrio ──────────────────────────────────────────────
    // En el archivo, el vidrio va como transparencia sencilla (color + 12 % de opacidad): es lo único que entiende
    // el AR, que al vidrio «físico» de Rhino lo pinta negro (ver scripts/reparar-uv.js). Pero así, en el visor 3D se
    // ve plano: o lechoso o invisible. Aquí, solo para el visor de la página, esos materiales (marcados por el
    // optimizador con «vidrio») se vuelven vidrio de verdad: dejan pasar la luz y reflejan el entorno, sobre todo
    // de lado. Al entrar al AR del navegador se devuelven a la transparencia sencilla, y al salir vuelven.
    const vidrios = new Map();          // material → cómo venía en el archivo
    function vidrioReal(activar) {
      try {
        const escena = interno('scene');
        if (!escena) return;
        escena.traverse(o => {
          for (const mat of [].concat(o.material || [])) {
            const es = mat.isMeshPhysicalMaterial && ((mat.userData && mat.userData.vidrio) || vidrios.has(mat));
            if (!es) continue;
            if (!vidrios.has(mat)) vidrios.set(mat, { color: mat.color.clone(), opacity: mat.opacity, transparent: mat.transparent, depthWrite: mat.depthWrite });
            const antes = vidrios.get(mat);
            if (activar) {
              mat.transmission = 1; mat.ior = 1.5; mat.thickness = 0; mat.roughness = 0; mat.metalness = 0;
              mat.specularIntensity = 1; mat.envMapIntensity = 1.6;
              mat.color.setRGB(0.97, 0.99, 1);
              mat.opacity = 1; mat.transparent = false; mat.depthWrite = true;
            } else {
              mat.transmission = 0; mat.envMapIntensity = 1;
              mat.color.copy(antes.color);
              mat.opacity = antes.opacity; mat.transparent = antes.transparent; mat.depthWrite = antes.depthWrite;
            }
            mat.needsUpdate = true;
          }
        });
        const pintar = interno('needsRender');
        if (pintar) pintar.call(viewer);
      } catch (e) { /* si cambia la versión de model-viewer, queda la transparencia sencilla */ }
    }
    viewer.addEventListener('ar-status', e => {
      const estado = e.detail && e.detail.status;
      if (estado === 'session-started') vidrioReal(false);
      if (estado === 'not-presenting' || estado === 'failed') vidrioReal(true);
    });

    viewer.addEventListener('load', () => {
      afinarImagenes();
      vidrios.clear();
      vidrioReal(new URLSearchParams(location.search).get('vidrio') !== '0');
      mostrarInterfaz();
      picker.classList.remove('cargando');
      precargar(actual + 1);
    });

    viewer.addEventListener('error', () => {
      const m = lista[actual];
      if (!m) return;
      const ruta = decodeURI(new URL(rutaModelo(m)).pathname).replace(/^\//, '');
      if (lista.length > 1) {
        // En una colección, un modelo faltante no bloquea a los demás
        mostrarInterfaz();
        picker.classList.remove('cargando');
        avisar(`No se encontró "${m.nombre}". Verifica que esté en /${ruta}`);
      } else {
        mostrarBienvenida('Modelo no encontrado', `No se encontró "${m.nombre}". Verifica que el archivo esté en /${ruta}`);
      }
    });

    iniciar();

    async function iniciar() {
      if (coleccion) {
        let definicion;
        try {
          // no-cache: los cambios en colecciones.json se ven sin esperar la caché del navegador
          const res = await fetch('colecciones.json', { cache: 'no-cache' });
          definicion = (await res.json())[coleccion];
        } catch (e) {
          mostrarBienvenida('Campaña no disponible', 'No se pudo leer la lista de campañas (colecciones.json).');
          return;
        }
        if (!definicion || !definicion.modelos?.length) {
          mostrarBienvenida('Campaña no encontrada', `No existe la campaña "${coleccion}" o todavía no tiene piezas publicadas.`);
          return;
        }
        // Cada modelo puede ser "Exh_opc_01" o { "id", "nombre", "archivo" }
        lista = definicion.modelos.map(m => typeof m === 'string'
          ? { id: m, nombre: m }
          : { id: m.id, nombre: m.nombre || m.id, archivo: m.archivo, usdz: m.usdz, version: m.version });
        document.getElementById('tituloCampana').textContent = definicion.titulo || coleccion;
        // Luz guardada para la campaña en Flujo AR (paso 4)
        if (typeof definicion.exposicion === 'number') viewer.exposure = definicion.exposicion;
        if (Number.isFinite(exposicionUrl)) viewer.exposure = exposicionUrl;

        // QR de una sola pieza de la campaña
        if (pieza) {
          lista = lista.filter(m => m.id === pieza);
          if (!lista.length) {
            mostrarBienvenida('Pieza no encontrada', `La campaña "${definicion.titulo || coleccion}" no tiene la pieza "${pieza}".`);
            return;
          }
        }
        if (lista.length > 1) armarSelector();

        const inicio = parseInt(params.get('i'), 10) - 1;
        mostrarModelo(inicio >= 0 && inicio < lista.length ? inicio : 0);
      } else if (modelo) {
        const nombre = params.get('nombre') || modelo.replace(/-/g, ' ');
        lista = [{ id: modelo, nombre }];
        mostrarModelo(0);
      } else {
        ocultarLoading();
        document.getElementById('vrLink').hidden = false;   // la entrada al entorno VR solo en la página de inicio
        welcome.hidden = false;
      }
    }

    // ── Cambiar de modelo ───────────────────────────────────
    function mostrarModelo(i) {
      actual = (i + lista.length) % lista.length;
      const m = lista[actual];
      // «001_ISLA_AXE» → «ISLA AXE» (el mismo nombre limpio de la tarjeta)
      document.getElementById('tituloPieza').textContent =
        String(m.nombre || '').replace(/^\d+[_\-\s]+/, '').replace(/_/g, ' ').trim() || m.nombre;

      if (lista.length > 1) {
        pickerName.textContent = `Pieza ${actual + 1} de ${lista.length}`;
        picker.classList.add('cargando');
        [...dots.children].forEach((d, k) => d.classList.toggle('activo', k === actual));
        // Recordar la posición en la URL (sin recargar) para compartir o recargar
        // Ruta absoluta: las páginas limpias usan <base href="../">, que cambiaría una ruta relativa
        history.replaceState(null, '', location.pathname +
          (preset.coleccion ? `?i=${actual + 1}` : `?coleccion=${encodeURIComponent(coleccion)}&i=${actual + 1}`));
      }

      // En iPhone, model-viewer genera el .usdz desde el .glb (sale sin animación). Las piezas animadas traen
      // su propio .usdz animado (exportado por el animador de Flujo AR)
      if (m.usdz) viewer.setAttribute('ios-src', rutaArchivo(m.usdz, m.version));
      else viewer.removeAttribute('ios-src');
      viewer.setAttribute('src', rutaModelo(m));
      viewer.setAttribute('alt', m.nombre);
    }

    function armarSelector() {
      picker.hidden = false;
      pagina.classList.add('varias');
      dots.innerHTML = lista.map(() => '<span class="dot"></span>').join('');
      document.getElementById('prevBtn').onclick = () => mostrarModelo(actual - 1);
      document.getElementById('nextBtn').onclick = () => mostrarModelo(actual + 1);

      // Deslizar sobre el selector o los textos (no sobre el modelo, que usa el arrastre para rotar)
      let x0 = null;
      const zona = [picker, document.querySelector('.texto')];
      zona.forEach(z => z.addEventListener('pointerdown', e => { x0 = e.clientX; }));
      zona.forEach(z => z.addEventListener('pointerup', e => {
        if (x0 === null) return;
        const dx = e.clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 50) mostrarModelo(actual + (dx < 0 ? 1 : -1));
      }));

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') mostrarModelo(actual + 1);
        if (e.key === 'ArrowLeft')  mostrarModelo(actual - 1);
      });
    }

    // Descarga el siguiente modelo en segundo plano para que el cambio sea rápido
    function precargar(i) {
      if (lista.length < 2) return;
      const m = lista[(i + lista.length) % lista.length];
      fetch(rutaModelo(m)).catch(() => {});
    }

    // Piezas de campaña: la ruta viene en colecciones.json (las carpetas pueden tener tildes y espacios).
    // Formato anterior: models/<id>/<id>.glb
    // Se devuelve la dirección COMPLETA: model-viewer arma el enlace para el AR de Android (Scene Viewer)
    // con la dirección de la página e ignora <base>, así que en las páginas limpias (/alpina/) una ruta
    // relativa apuntaría a /alpina/models/… y el AR fallaría.
    function rutaModelo(m) {
      return rutaArchivo(m.archivo || `models/${m.id}/${m.id}.glb`, m.version);
    }

    function rutaArchivo(relativa, version) {
      const url = new URL(encodeURI(relativa), document.baseURI);
      // Versión del contenido: al reoptimizar cambia, y así nadie usa una copia vieja en caché
      if (version) url.searchParams.set('v', version);
      return url.href;
    }

    // ── Interfaz ────────────────────────────────────────────
    function mostrarInterfaz() {
      if (interfazVisible) return;
      interfazVisible = true;
      ocultarLoading();

      // Sin AR disponible (computador), se oculta el botón y se sugiere abrir en el celular. Siempre dos líneas.
      arBtn.hidden = !viewer.canActivateAR;
      if (isIOS || isAndroid) hintText.innerHTML = 'Toca «Ver en AR» y apunta al piso para verlo a tamaño real.<br>Gíralo con un dedo y acércalo con dos.';
      else hintText.innerHTML = 'Arrástralo para girarlo y usa la rueda para acercarlo.<br>Ábrelo desde tu celular para verlo en realidad aumentada.';
    }

    function mostrarBienvenida(titulo, mensaje) {
      ocultarLoading();
      document.getElementById('welcomeTitle').textContent = titulo;
      document.getElementById('welcomeMsg').textContent   = mensaje;
      welcome.hidden = false;
    }

    let toastTimer;
    function avisar(texto, ms = 4000) {
      toast.textContent = texto;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, ms);
    }

    // ── Cuando el AR no abre ────────────────────────────────
    // Android tiene dos formas de AR: el del navegador (WebXR) y la app de Google (Scene Viewer). Desde mediados
    // de octubre de 2026 Scene Viewer se cierra sola al abrirse, con cualquier pieza y en cualquier sitio (error
    // de la app de Google, github.com/google-ar/arcore-android-sdk/issues/1795): el celular «trata de entrar» y
    // vuelve a esta página sin decir nada. El 16/11/2026 parecía un fallo de la isla de AXE y no lo era.
    // Por eso ar-modes pone primero WebXR; Scene Viewer queda de respaldo. Si algún día Google lo corrige y se
    // prefiere Scene Viewer otra vez, basta invertir el orden en el atributo ar-modes.
    // Aquí se avisa cuando alguna de las dos falla, para que no vuelva a pasar en silencio.
    let sceneViewerFallo = false;
    addEventListener('hashchange', () => {
      if (location.hash !== '#model-viewer-no-ar-fallback') return;
      sceneViewerFallo = true;
      avisar('La app de AR de Android no abrió (es una falla conocida de Google). Toca otra vez «Ver en AR».', 9000);
    });
    viewer.addEventListener('ar-status', e => {
      const estado = e.detail && e.detail.status;
      if (estado === 'failed') {
        avisar(sceneViewerFallo
          ? 'Este celular no pudo abrir la realidad aumentada. Revisa que «Servicios de Google Play para RA» esté instalado y actualizado.'
          : 'No se pudo abrir la realidad aumentada en este celular.', 9000);
      }
    });

    // ── Activar AR ──────────────────────────────────────────
    // Guía de gestos (guia-ar.js): dentro del AR del navegador sale sobre la cámara; en iPhone, la primera vez
    // se muestra antes de abrir el AR de Apple, que no deja poner nada encima.
    const guiaAR = window.instalarGuiaAR ? window.instalarGuiaAR(viewer) : null;
    function activarAR() {
      if (guiaAR && guiaAR.previa(abrirAR)) return;
      abrirAR();
    }
    function abrirAR() {
      try {
        viewer.activateAR();
      } catch (e) {
        // Fallback: simular click en el botón interno de model-viewer
        const btn = viewer.shadowRoot?.querySelector('[slot="ar-button"], .ar-button');
        if (btn) btn.click();
      }
    }

    // ── Helpers ─────────────────────────────────────────────
    function ocultarLoading() {
      loading.classList.add('fade');
      setTimeout(() => { loading.hidden = true; }, 420);
    }

    function capitalizar(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
  </script>

</body>
</html>
